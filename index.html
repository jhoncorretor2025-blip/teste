<head>

<style>
:root{--bg:#070b14;--panel:#10192d;--panel2:#0b1324;--line:#2c3d5e;--text:#f7f9ff;--muted:#9eabc3;--green:#67ef8a;--pink:#ff72bd;--blue:#63b3ff;--gold:#ffd24d;--red:#ff657b}

body{display:flex;justify-content:center;padding:10px;overflow-x:hidden}.app{width:min(96vw,1220px)}

.panel,.arenaShell{background:#11182bf3;border:1px solid var(--line);border-radius:20px;box-shadow:0 18px 60px #0008;backdrop-filter:blur(10px)}.panel{padding:14px}.menuGrid{display:grid;grid-template-columns:1.05fr 1.4fr 1.05fr;gap:12px}.card{background:linear-gradient(180deg,#121c32,#0c1424);border:1px solid #293a59;border-radius:15px;padding:14px}.card h2{margin:0 0 9px;font-size:1.04rem}
.select,.btn{width:100%;min-height:44px;border-radius:12px;font:inherit;font-weight:800}.select{padding:9px 11px;background:#070e1b;color:#fff;border:1px solid #354666}.btn{padding:10px;border:0;background:var(--green);color:#07100a;cursor:pointer;box-shadow:0 8px 25px #67ef8a22}.btn.alt{background:#293958;color:#fff;box-shadow:none}.btn.danger{background:var(--red);color:#fff}.btn:active{transform:translateY(1px)}
.row{display:flex;gap:8px;flex-wrap:wrap}.row>.btn{flex:1;width:auto}.muted{color:var(--muted);font-size:.82rem}.hidden{display:none!important}.players{display:grid;gap:8px;margin-top:9px}.player{border:1px solid #2a3a57;border-radius:12px;padding:10px;background:#0b1425}.playerHead{display:flex;align-items:center;justify-content:space-between;gap:8px}.check{display:flex;gap:6px;align-items:center;margin-top:7px;color:#c6d1e5;font-size:.8rem}
.top{display:flex;justify-content:space-between;align-items:center;gap:9px;flex-wrap:wrap;margin-bottom:9px}.scores{display:flex;gap:7px;flex-wrap:wrap}.score{background:#0b1220;border:1px solid #2b3b58;padding:8px 10px;border-radius:10px;font-size:.83rem}.score b{font-size:1rem}.status{display:flex;align-items:center;gap:9px;background:#0b1220;border:1px solid #293653;border-radius:12px;padding:8px 10px;margin-bottom:9px}.meter{height:9px;flex:1;background:#202b42;border-radius:99px;overflow:hidden}.meter i{display:block;height:100%;width:100%;border-radius:99px;background:linear-gradient(90deg,var(--green),var(--blue));transition:width .12s}.badge{padding:5px 8px;border-radius:99px;background:#1a2846;color:#b9d9ff;font-size:.72rem;font-weight:900}

.help{text-align:center;color:#8d99b2;font-size:.76rem;margin:9px 0}.kbd{padding:3px 6px;border:1px solid #394969;border-radius:6px;background:#121a2c}.touch{display:none;position:relative;height:150px;margin-top:8px;user-select:none}.dpad{position:absolute;left:4px;bottom:3px;display:grid;grid-template-columns:repeat(3,52px);grid-template-rows:repeat(3,42px);gap:6px}.tbtn{border:1px solid #405579;background:#1a2946;color:#fff;border-radius:12px;font-size:1.1rem}.boost{position:absolute;right:5px;bottom:5px;width:98px;height:98px;border-radius:50%;border:2px solid #ffd24d66;background:radial-gradient(circle,#49370f,#17150d 68%);color:#ffd24d;font-weight:900;box-shadow:0 0 28px #ffd24d33}.boost.active{transform:scale(.96);box-shadow:0 0 42px #ffd24d99}#nameOptions{display:grid;gap:7px;margin-top:9px}.nameInput{width:100%;min-height:42px;border-radius:11px;border:1px solid #344564;background:#070e1b;color:#fff;padding:9px 11px;font:inherit}

<body>
<div class="app"><h1>🐍 Snake Arena</h1><p class="subtitle">Até 3 jogadores • Humanos ou CPU • nomes • Turbo • 3 comidas</p>
<section id="menu" class="panel"><div class="menuGrid">
<div class="card"><h2>👥 Jogadores</h2><select id="count" class="select"><option value="1">1 jogador</option><option value="2" selected>2 jogadores</option><option value="3">3 jogadores</option></select><div id="players" class="players"></div></div>
<div class="card"><h2>🎮 Modo de jogo</h2><select id="mode" class="select"><option value="classic">🏆 Clássico</option><option value="turbo">⚡ Turbo Worms</option><option value="survival">💀 Sobrevivência</option><option value="collection">💎 Coleta</option><option value="king">👑 Rei da Arena</option><option value="race">🏁 Corrida</option></select><select id="map" class="select" style="margin-top:8px"><option value="classic">🟢 Clássico</option><option value="maze">🧱 Labirinto</option><option value="arena">⭕ Arena</option><option value="portals">🌀 Portais</option><option value="chaos">🌋 Caos</option></select><select id="series" class="select" style="margin-top:8px"><option value="1">1 rodada</option><option value="3">Melhor de 3</option><option value="5">Melhor de 5</option></select><div class="row" style="margin-top:9px"><button id="start" class="btn">🚀 Jogar</button><button id="sound" class="btn alt">🔊 Som</button></div><div class="muted" style="margin-top:8px">No Turbo, segure o botão especial para acelerar e deixar pedaços.</div></div>
<div class="card"><h2>🏷️ Nome e visual</h2><input id="p1name" class="nameInput" maxlength="14" value="Jhon" placeholder="Seu nome"><label class="check"><input id="showP1" type="checkbox" checked> Mostrar meu nome sobre a minhoca</label><label class="check"><input id="showAll" type="checkbox" checked> Mostrar nomes dos outros jogadores</label><select id="skin" class="select" style="margin-top:9px"><option value="0">🟢 Neon</option><option value="1">🩷 Rosa</option><option value="2">🔵 Azul</option><option value="3">🟣 Cósmica</option><option value="4">🟠 Fogo</option></select><div id="leader" style="margin-top:10px"></div></div>
</div></section>
<section id="game" class="hidden"><div class="top"><div id="scores" class="scores"></div><div class="row"><button id="pause" class="btn alt">⏸️</button><button id="restart" class="btn">🔄</button><button id="back" class="btn alt">🏠</button></div></div><div class="status"><span id="modeBadge" class="badge">🏆 CLÁSSICO</span><span>⚡</span><div class="meter"><i id="energyBar"></i></div><b id="energyText">100%</b><span>Rodada <b id="roundInfo">1/1</b></span></div><div class="arenaShell"><div class="arena"><canvas id="c" width="1000" height="625"></canvas><div id="overlay" class="overlay hidden"><div class="overlayCard"><h2 id="ovTitle">Fim</h2><p id="ovText"></p><button id="next" class="btn">Continuar</button></div></div></div></div><div id="touch" class="touch"><div class="dpad"><span></span><button class="tbtn" data-dir="up">▲</button><span></span><button class="tbtn" data-dir="left">◀</button><button class="tbtn" data-dir="down">▼</button><button class="tbtn" data-dir="right">▶</button></div><button id="boostTouch" class="boost">⚡<br>TURBO</button></div><p class="help">P1: ↑↓←→ + Espaço • P2: WASD + Shift • P3: IJKL + Enter • P: pausa</p></section></div>
<script>
'use strict';const $=id=>document.getElementById(id),canvas=$('c'),ctx=canvas.getContext('2d');const COLS=50,ROWS=31,CELL=20,NORMAL=105,TURBO=58,FOOD_COUNT=3;const COLORS=['#67ef8a','#ff72bd','#63b3ff','#bb7cff','#ff9f43'];const SKINSETS=[COLORS,['#7affd2','#47cfa2','#25a77d','#1e7d61','#0f5543'],['#b9e5ff','#63b3ff','#3c84d9','#2f5ca4','#263e72'],['#e0b8ff','#bb7cff','#8b55dc','#653ca6','#452d78'],['#ffd59a','#ff9f43','#ff6f1e','#d74d00','#8c3100']];const POWER_TYPES=['shield','magnet','freeze','shrink','mega'];let count=2,types=['human','human','cpu'],mode='classic',map='classic',series=1,skin=0,sound=true,names=['Jhon','Jogador 2','Jogador 3'],showNames=[true,true,true],showOther=true,snakes=[],deadBodies=[],trail=[],foods=[],powers=[],dirs=[],nextDirs=[],alive=[],boosting=[false,false,false],energy=[100,100,100],score=[0,0,0],round=1,timer=null,running=false,paused=false,ac=null,freezeUntil=0,xp=load('snakeXP2',[0,0,0]),lvl=load('snakeLVL2',[1,1,1]),wins=load('snakeWINS2',[0,0,0]),record=load('snakeREC2',[0,0,0]);function load(k,d){try{return JSON.parse(localStorage.getItem(k))||d}catch(e){return d}}function save(){localStorage.setItem('snakeXP2',JSON.stringify(xp));localStorage.setItem('snakeLVL2',JSON.stringify(lvl));localStorage.setItem('snakeWINS2',JSON.stringify(wins));localStorage.setItem('snakeREC2',JSON.stringify(record))}function beep(f=440,d=.06){if(!sound)return;try{ac??=new(window.AudioContext||window.webkitAudioContext)();let o=ac.createOscillator(),g=ac.createGain();o.frequency.value=f;o.type='square';g.gain.value=.018;o.connect(g);g.connect(ac.destination);o.start();g.gain.exponentialRampToValueAtTime(.001,ac.currentTime+d);o.stop(ac.currentTime+d)}catch(e){}}function gain(i,n){xp[i]+=n;let need=lvl[i]*50;while(xp[i]>=need){xp[i]-=need;lvl[i]++;beep(900,.1);need=lvl[i]*50}save();renderLeader()}function escapeHtml(s){return String(s||'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}function renderLeader(){let a=[0,1,2].map(i=>({i,w:wins[i],l:lvl[i],r:record[i]})).sort((a,b)=>b.w-a.w||b.r-a.r);$('leader').innerHTML='<b>🏅 Ranking local</b><br>'+a.map((q,k)=>`${k+1}º ${escapeHtml(names[q.i])} • Nv ${q.l} • ${q.w} vit. • record ${q.r}`).join('<br>')}function makePlayers(){if(count===1)types=['human','cpu','cpu'];if(count===2)types=['human','human','cpu'];if(count===3)types=['human','human','human'];$('players').innerHTML='';for(let i=0;i<count;i++){let d=document.createElement('div');d.className='player';d.innerHTML=`<div class="playerHead"><b>${['🟢','🩷','🔵'][i]} Jogador ${i+1}</b><span class="muted">Nv ${lvl[i]}</span></div><select class="select typ" data-i="${i}" style="margin-top:7px"><option value="human"${types[i]==='human'?' selected':''}>👤 Humano</option><option value="cpu"${types[i]==='cpu'?' selected':''}>🤖 CPU</option></select><input class="nameInput pname" data-i="${i}" maxlength="14" value="${escapeHtml(names[i])}" placeholder="Nome"><label class="check"><input type="checkbox" class="showName" data-i="${i}"${showNames[i]?' checked':''}> Mostrar nome</label><div class="muted" style="margin-top:4px">${i===0?'Setas + Espaço':i===1?'W A S D + Shift':'I J K L + Enter'}</div>`;$('players').appendChild(d)}}
$('count').addEventListener('change',e=>{count=+e.target.value;makePlayers()});$('players').addEventListener('input',e=>{if(e.target.classList.contains('pname'))names[+e.target.dataset.i]=e.target.value.trim()||`Jogador ${+e.target.dataset.i+1}`});$('players').addEventListener('change',e=>{if(e.target.classList.contains('typ'))types[+e.target.dataset.i]=e.target.value;if(e.target.classList.contains('showName'))showNames[+e.target.dataset.i]=e.target.checked});$('p1name').addEventListener('input',()=>names[0]=$('p1name').value.trim()||'Jhon');$('showP1').addEventListener('change',e=>showNames[0]=e.target.checked);$('showAll').addEventListener('change',e=>showOther=e.target.checked);$('mode').addEventListener('change',e=>mode=e.target.value);$('map').addEventListener('change',e=>map=e.target.value);$('series').addEventListener('change',e=>series=+e.target.value);$('skin').addEventListener('change',e=>skin=+e.target.value);$('sound').addEventListener('click',e=>{sound=!sound;e.target.textContent=sound?'🔊 Som':'🔇 Som'});makePlayers();renderLeader();$('p1name').value=names[0];
function occupied(x,y){return snakes.some(s=>s.some(p=>p.x===x&&p.y===y))||deadBodies.some(s=>s?.some(p=>p.x===x&&p.y===y))||trail.some(p=>p.x===x&&p.y===y)}function blocked(x,y){if(map==='maze')return(x===14||x===15||x===34||x===35)&&y>4&&y<27;if(map==='arena'){const dx=x-COLS/2,dy=y-ROWS/2;return dx*dx+dy*dy<20}if(map==='chaos')return(x*5+y*7)%23===0;return false}function wrap(p){if(map!=='portals')return p;let q={...p};if(q.x<0)q.x=COLS-1;if(q.x>=COLS)q.x=0;if(q.y<0)q.y=ROWS-1;if(q.y>=ROWS)q.y=0;return q}function safe(p){return map==='portals'||(p.x>=0&&p.x<COLS&&p.y>=0&&p.y<ROWS&&!blocked(p.x,p.y))}function foodsInit(){foods=[];let guard=0;while(foods.length<FOOD_COUNT&&guard++<10000){let f={x:Math.floor(Math.random()*COLS),y:Math.floor(Math.random()*ROWS)};if(!occupied(f.x,f.y)&&!blocked(f.x,f.y)&&!foods.some(q=>q.x===f.x&&q.y===f.y))foods.push(f)}}function spawnPower(){if(Math.random()<.045&&powers.length<4){let t=POWER_TYPES[Math.floor(Math.random()*POWER_TYPES.length)];for(let guard=0;guard<500;guard++){let p={x:Math.floor(Math.random()*COLS),y:Math.floor(Math.random()*ROWS),t};if(!occupied(p.x,p.y)&&!blocked(p.x,p.y)){powers.push(p);break}}}}function opposite(a,b){return a.x+b.x===0&&a.y+b.y===0}function setDir(i,d){if(alive[i]!==false&&!opposite(dirs[i],d))nextDirs[i]=d}
const KM={ArrowUp:{x:0,y:-1},ArrowDown:{x:0,y:1},ArrowLeft:{x:-1,y:0},ArrowRight:{x:1,y:0},KeyW:{x:0,y:-1},KeyS:{x:0,y:1},KeyA:{x:-1,y:0},KeyD:{x:1,y:0},KeyI:{x:0,y:-1},KeyK:{x:0,y:1},KeyJ:{x:-1,y:0},KeyL:{x:1,y:0}};function boostCode(i,c){return i===0&&c==='Space'||i===1&&(c==='ShiftLeft'||c==='ShiftRight')||i===2&&c==='Enter'}document.addEventListener('keydown',e=>{if(e.code==='KeyP'&&running){paused=!paused;$('pause').textContent=paused?'▶️':'⏸️';return}for(let i=0;i<count;i++)if(types[i]==='human'){const ks=i===0?['ArrowUp','ArrowDown','ArrowLeft','ArrowRight']:i===1?['KeyW','KeyS','KeyA','KeyD']:['KeyI','KeyK','KeyJ','KeyL'];if(ks.includes(e.code)){e.preventDefault();setDir(i,KM[e.code])}if(mode==='turbo'&&boostCode(i,e.code)){e.preventDefault();boosting[i]=true}}});document.addEventListener('keyup',e=>{for(let i=0;i<count;i++)if(boostCode(i,e.code))boosting[i]=false});document.querySelectorAll('[data-dir]').forEach(b=>b.addEventListener('pointerdown',e=>{e.preventDefault();setDir(0,{up:KM.ArrowUp,down:KM.ArrowDown,left:KM.ArrowLeft,right:KM.ArrowRight}[b.dataset.dir])}));$('boostTouch').addEventListener('pointerdown',e=>{e.preventDefault();if(mode==='turbo'){boosting[0]=true;$('boostTouch').classList.add('active')}});['pointerup','pointercancel','pointerleave'].forEach(ev=>$('boostTouch').addEventListener(ev,()=>{boosting[0]=false;$('boostTouch').classList.remove('active')}));
function aiDir(i){const h=snakes[i][0],opts=[dirs[i],{x:0,y:-1},{x:0,y:1},{x:-1,y:0},{x:1,y:0}].filter(d=>!opposite(d,dirs[i]));let target=foods.reduce((best,f)=>!best||dist(h,f)<dist(h,best)?f:best,null),best=dirs[i],bv=-1e9;for(const d of opts){const p=wrap({x:h.x+d.x,y:h.y+d.y});let v=target?-dist(p,target):0;if(!safe(p))v-=1e5;if(occupiedOther(i,p.x,p.y))v-=2e4;if(trail.some(t=>t.x===p.x&&t.y===p.y))v-=8e3;if(powers.some(q=>q.x===p.x&&q.y===p.y))v+=500;if(v>bv){bv=v;best=d}}if(mode==='turbo'&&energy[i]>30&&Math.random()<.035)boosting[i]=true;if(mode==='turbo'&&Math.random()<.03)boosting[i]=false;return best}function dist(a,b){return Math.abs(a.x-b.x)+Math.abs(a.y-b.y)}function occupiedOther(i,px,py){for(let j=0;j<count;j++)if(j!==i&&snakes[j]?.some(p=>p.x===px&&p.y===py))return true;return false}
function startMatch(){score=[0,0,0];round=1;startRound()}function startRound(){clearInterval(timer);snakes=[];deadBodies=[];trail=[];powers=[];dirs=[];nextDirs=[];alive=Array(count).fill(true);energy=[100,100,100];boosting=[false,false,false];paused=false;running=true;freezeUntil=0;$('overlay').classList.add('hidden');const starts=[{x:6,y:8,dx:1,dy:0},{x:43,y:22,dx:-1,dy:0},{x:25,y:27,dx:0,dy:-1}];for(let i=0;i<count;i++){const s=starts[i];snakes.push([{x:s.x,y:s.y},{x:s.x-s.dx,y:s.y-s.dy},{x:s.x-2*s.dx,y:s.y-2*s.dy}]);dirs.push({x:s.dx,y:s.dy});nextDirs.push({x:s.dx,y:s.dy})}$('modeBadge').textContent={classic:'🏆 CLÁSSICO',turbo:'⚡ TURBO WORMS',survival:'💀 SOBREVIVÊNCIA',collection:'💎 COLETA',king:'👑 REI DA ARENA',race:'🏁 CORRIDA'}[mode];$('roundInfo').textContent=`${round}/${series}`;foodsInit();renderScores();updateEnergy();draw();schedule()}function schedule(){clearInterval(timer);let turbo=mode==='turbo'&&boosting.some((b,i)=>b&&alive[i]);timer=setInterval(tick,turbo?TURBO:NORMAL)}function applyPower(i,t){gain(i,20);beep(1000,.09);if(t==='shield')energy[i]=100;if(t==='magnet')for(const f of foods)if(dist(snakes[i][0],f)<12)score[i]++;if(t==='freeze')freezeUntil=performance.now()+1800;if(t==='shrink')snakes[i]=snakes[i].slice(0,Math.max(3,Math.floor(snakes[i].length*.55)));if(t==='mega'){score[i]+=3;snakes[i].push({...snakes[i][snakes[i].length-1]})}
function tick(){if(paused||!running)return;spawnPower();for(let i=0;i<count;i++)if(alive[i]){if(types[i]==='cpu')setDir(i,aiDir(i));if(mode==='turbo'){if(boosting[i])energy[i]=Math.max(0,energy[i]-1.8);else energy[i]=Math.min(100,energy[i]+.55);if(energy[i]<=0)boosting[i]=false}dirs[i]=(i>0&&freezeUntil>performance.now())?dirs[i]:nextDirs[i]}const heads=snakes.map((s,i)=>alive[i]?wrap({x:s[0].x+dirs[i].x,y:s[0].y+dirs[i].y}):null),deaths=Array(count).fill(false);for(let i=0;i<count;i++)if(alive[i]){const h=heads[i];if(!safe(h)||trail.some(t=>t.x===h.x&&t.y===h.y))deaths[i]=true;for(let j=0;j<count;j++)if(i!==j&&heads[j]&&h.x===heads[j].x&&h.y===heads[j].y)deaths[i]=true;for(let j=0;j<count;j++)if(j!==i&&snakes[j].some(p=>p.x===h.x&&p.y===h.y))deaths[i]=true;if(mode!=='turbo'&&snakes[i].slice(0,-1).some(p=>p.x===h.x&&p.y===h.y))deaths[i]=true;if(deadBodies.some(s=>s?.some(p=>p.x===h.x&&p.y===h.y)))deaths[i]=true}for(let i=0;i<count;i++)if(alive[i]){const old=snakes[i].map(p=>({...p}));if(deaths[i]){alive[i]=false;deadBodies.push(old);boosting[i]=false;gain(i,25);beep(120,.12);continue}const h=heads[i];snakes[i].unshift(h);if(mode==='turbo'&&boosting[i]&&snakes[i].length>3){const tail=snakes[i][snakes[i].length-1];trail.push({x:tail.x,y:tail.y,owner:i})}const fi=foods.findIndex(f=>f.x===h.x&&f.y===h.y);if(fi>=0){score[i]++;gain(i,10);foods.splice(fi,1);while(foods.length<FOOD_COUNT){let f={x:Math.floor(Math.random()*COLS),y:Math.floor(Math.random()*ROWS)};if(!occupied(f.x,f.y)&&!blocked(f.x,f.y)&&!foods.some(q=>q.x===f.x&&q.y===f.y)){foods.push(f);break}}beep(720,.05)}const pi=powers.findIndex(p=>p.x===h.x&&p.y===h.y);if(pi>=0){applyPower(i,powers[pi].t);powers.splice(pi,1)}else snakes[i].pop();if(mode==='collection'&&score[i]>=10){endRound(i);return}if(mode==='race'&&snakes[i].length>=30){endRound(i);return}if(mode==='king'&&h.x>20&&h.x<30&&h.y>10&&h.y<21)score[i]++}if(trail.length>1200)trail.splice(0,150);if(alive.filter(Boolean).length<=1){endRound(alive.findIndex(Boolean));return}renderScores();updateEnergy();draw();schedule()}
function endRound(winner){clearInterval(timer);running=false;if(winner<0)winner=score.slice(0,count).indexOf(Math.max(...score.slice(0,count)));if(winner>=0){score[winner]++;wins[winner]++;record[winner]=Math.max(record[winner],score[winner]);gain(winner,50)}save();renderLeader();$('ovTitle').textContent=winner>=0?`🏆 ${playerLabel(winner)} venceu!`:'🤝 Empate!';$('ox').textContent=`Rodada ${round} • 3 comidas ativas • corpos permanecem no mapa`;$('next').textContent=round<series?'➡️ Próxima rodada':'🏅 Resultado final';$('overlay').classList.remove('hidden');$('next').onclick=round<series?nextRound:finalResult}function nextRound(){round++;startRound()}function finalResult(){const mx=Math.max(...score.slice(0,count)),ws=[];for(let i=0;i<count;i++)if(score[i]===mx)ws.push(playerLabel(i));$('ovTitle').textContent=ws.length>1?'🤝 Empate final!':`👑 ${ws[0]} campeão!`;$('ox').textContent=`Placar: ${score.slice(0,count).join(' • ')} • Vitórias: ${wins.slice(0,count).join(' • ')}`;$('next').textContent='🔄 Nova partida';$('next').onclick=startMatch}function playerLabel(i){return names[i]||`Jogador ${i+1}`}function renderScores(){$('scores').innerHTML='';for(let i=0;i<count;i++){const d=document.createElement('div');d.className='score';d.innerHTML=`${['🟢','🩷','🔵'][i]} ${escapeHtml(playerLabel(i))}${types[i]==='cpu'?' 🤖':''}: <b>${score[i]}</b> • Nv ${lvl[i]}`;$('scores').appendChild(d)}}function updateEnergy(){const v=Math.round(energy[0]||0);$('energyBar').style.width=v+'%';$('energyText').textContent=v+'%'}
function startGame(){names[0]=$('p1name').value.trim()||'Jhon';showNames[0]=$('showP1').checked;showOther=$('showAll').checked;mode=$('mode').value;map=$('map').value;series=+$('series').value;skin=+$('skin').value;$('menu').classList.add('hidden');$('game').classList.remove('hidden');startMatch()}function goMenu(){clearInterval(timer);running=false;$('game').classList.add('hidden');$('menu').classList.remove('hidden');$('overlay').classList.add('hidden');renderLeader();makePlayers()}$('start').onclick=startGame;$('pause').onclick=()=>{paused=!paused;$('pause').textContent=paused?'▶️':'⏸️'};$('restart').onclick=startRound;$('back').onclick=goMenu;
function draw(){const g=ctx.createRadialGradient(canvas.width/2,canvas.height/2,40,canvas.width/2,canvas.height/2,canvas.width*.7);g.addColorStop(0,'#112039');g.addColorStop(1,'#04070d');ctx.fillStyle=g;ctx.fillRect(0,0,canvas.width,canvas.height);ctx.strokeStyle='rgba(255,255,255,.035)';ctx.lineWidth=1;for(let i=0;i<=COLS;i++){ctx.beginPath();ctx.moveTo(i*CELL,0);ctx.lineTo(i*CELL,canvas.height);ctx.stroke()}for(let i=0;i<=ROWS;i++){ctx.beginPath();ctx.moveTo(0,i*CELL);ctx.lineTo(canvas.width,i*CELL);ctx.stroke()}if(map==='maze'){ctx.fillStyle='#30415f';for(const xx of [14,15,34,35])ctx.fillRect(xx*CELL,5*CELL,CELL,23*CELL)}if(map==='arena'){ctx.strokeStyle='#4b5f86';ctx.lineWidth=8;ctx.beginPath();ctx.arc(canvas.width/2,canvas.height/2,Math.sqrt(480)*CELL,0,Math.PI*2);ctx.stroke();ctx.lineWidth=1}if(map==='chaos'){ctx.fillStyle='#24314a';for(let xx=0;xx<COLS;xx++)for(let yy=0;yy<ROWS;yy++)if(blocked(xx,yy))ctx.fillRect(xx*CELL,yy*CELL,CELL,CELL)}if(map==='portals'){ctx.fillStyle='#9b7cff';for(const p of [{x:2,y:2},{x:COLS-3,y:ROWS-3}]){ctx.beginPath();ctx.arc(p.x*CELL+10,p.y*CELL+10,8,0,Math.PI*2);ctx.fill()}}foods.forEach((f,idx)=>{ctx.save();ctx.shadowBlur=18;ctx.shadowColor='#ffd24d';ctx.fillStyle=['#ffd24d','#ff9f43','#fff28a'][idx];ctx.beginPath();ctx.arc(f.x*CELL+10,f.y*CELL+10,7,0,Math.PI*2);ctx.fill();ctx.restore()});const pcols=['#d9e0ff','#ffd24d','#8be0ff','#cc9cff','#ff9f43'];powers.forEach(p=>{const k=POWER_TYPES.indexOf(p.t);ctx.save();ctx.shadowBlur=18;ctx.shadowColor=pcols[k];ctx.fillStyle=pcols[k];ctx.beginPath();ctx.arc(p.x*CELL+10,p.y*CELL+10,8,0,Math.PI*2);ctx.fill();ctx.fillStyle='#08101b';ctx.font='bold 9px system-ui';ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillText(p.t[0].toUpperCase(),p.x*CELL+10,p.y*CELL+10);ctx.restore()});trail.forEach(t=>{ctx.globalAlpha=.62;ctx.fillStyle=COLORS[t.owner];ctx.fillRect(t.x*CELL+4,t.y*CELL+4,CELL-8,CELL-8);ctx.globalAlpha=1});deadBodies.forEach(s=>s?.forEach(p=>{ctx.globalAlpha=.45;ctx.fillStyle='#b6becb';ctx.fillRect(p.x*CELL+4,p.y*CELL+4,CELL-8,CELL-8);ctx.globalAlpha=1}));for(let i=0;i<count;i++)if(snakes[i]){const arr=SKINSETS[skin];snakes[i].forEach((p,k)=>{if(!alive[i])return;const col=arr[(i+k)%arr.length];ctx.fillStyle=col;ctx.globalAlpha=k?0.84:1;ctx.shadowBlur=k===0?14:3;ctx.shadowColor=col;ctx.beginPath();ctx.roundRect(p.x*CELL+2,p.y*CELL+2,CELL-4,CELL-4,6);ctx.fill();ctx.shadowBlur=0;ctx.globalAlpha=1;if(k===0){ctx.fillStyle='#07110b';let ex=p.x*CELL+(dirs[i].x<0?5:dirs[i].x>0?14:5),ey=p.y*CELL+(dirs[i].y<0?5:dirs[i].y>0?14:5);ctx.beginPath();ctx.arc(ex,ey,2,0,Math.PI*2);ctx.fill();ctx.beginPath();ctx.arc(ex+(dirs[i].x===0?10:0),ey+(dirs[i].y===0?10:0),2,0,Math.PI*2);ctx.fill()}});if(showNames[i]&&(i===0||showOther)){ctx.fillStyle='#fff';ctx.font='bold 13px system-ui';ctx.textAlign='center';ctx.textBaseline='bottom';ctx.shadowColor='#000';ctx.shadowBlur=4;ctx.fillText(playerLabel(i),snakes[i][0].x*CELL+10,snakes[i][0].y*CELL-2);ctx.shadowBlur=0}}}
</script></body></html>
