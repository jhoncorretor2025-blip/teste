pan></span><button class="tbtn" data-d="up">▲</button><span></span><button class="tbtn" data-d="left">◀</button><button class="tbtn" data-d="down">▼</button><button class="tbtn" data-d="right">▶</button></div><button id="boostTouch" class="boost">⚡<br>TURBO</button></div><p class="help">P1: setas + Espaço • P2: WASD + Shift • P3: IJKL + Enter • P: pausa</p></section></div><script>'use strict';const $=id=>document.getElementById(id),C=$('c'),X=C.getContext('2d'),COL=50,ROW=31,CELL=20,NORMAL=110,TURBO=60;let count=2,types=['human','human','cpu'],names=['Jhon','Jogador 2','Jogador 3'],show=[true,true,true],showAll=true,mode='classic',map='Clássico',series=1,skin=0,sound=true,snakes=[],dead=[],trail=[],foods=[],dirs=[],nextDirs=[],alive=[],boost=[false,false,false],energy=[100,100,100],score=[0,0,0],round=1,timer=null,running=false,paused=false, wins=load('snakeWins',[0,0,0]), rec=load('snakeRec',[0,0,0]), audio=null;const K={ArrowUp:{x:0,y:-1},ArrowDown:{x:0,y:1},ArrowLeft:{x:-1,y:0},ArrowRight:{x:1,y:0},KeyW:{x:0,y:-1},KeyS:{x:0,y:1},KeyA:{x:-1,y:0},KeyD:{x:1,y:0},KeyI:{x:0,y:-1},KeyK:{x:0,y:1},KeyJ:{x:-1,y:0},KeyL:{x:1,y:0}},COLORS=['#67ef8a','#ff72bd','#63b3ff'];function load(k,d){try{return JSON.parse(localStorage.getItem(k))||d}catch(e){return d}}function save(){localStorage.setItem('snakeWins',JSON.stringify(wins));localStorage.setItem('snakeRec',JSON.stringify(rec))}function esc(s){return String(s||'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}function label(i){return names[i]||`Jogador ${i+1}`}function beep(f=440){if(!sound)return;try{audio??=new(window.AudioContext||window.webkitAudioContext)();let o=audio.createOscillator(),g=audio.createGain();o.frequency.value=f;o.connect(g);g.connect(audio.destination);g.gain.value=.02;o.start();g.gain.exponentialRampToValueAtTime(.001,audio.currentTime+.05);o.stop(audio.currentTime+.05)}catch(e){}}function makePlayers(){players.innerHTML='';for(let i=0;i<count;i++){let d=document.createElement('div');d.className='pl';d.innerHTML=`<b>${['🟢','🩷','🔵'][i]} Jogador ${i+1}</b><select class="select typ" data-i="${i}" style="margin-top:6px"><option value="human"${types[i]==='human'?' selected':''}>👤 Humano</option><option value="cpu"${types[i]==='cpu'?' selected':''}>🤖 CPU</option></select><input class="name pname" data-i="${i}" maxlength="14" value="${esc(names[i])}" placeholder="Nome"><label class="check"><input type="checkbox" class="sname" data-i="${i}"${show[i]?' checked':''}> Mostrar nome</label><div class="muted">${i===0?'Setas + Espaço':i===1?'W A S D + Shift':'I J K L + Enter'}</div>`;players.appendChild(d)}}function leader(){let a=[0,1,2].sort((a,b)=>wins[b]-wins[a]||rec[b]-rec[a]);leaderEl.innerHTML='<b>🏅 Ranking local</b><br>'+a.map((i,k)=>`${k+1}º ${esc(label(i))} • ${wins[i]} vit. • record ${rec[i]}`).join('<br>')}const leaderEl=$('leader');leader();makePlayers();$('count').onchange=e=>{count=+e.target.value;types=count===1?['human','cpu','cpu']:count===2?['human','human','cpu']:['human','human','human'];makePlayers()};players.oninput=e=>{if(e.target.classList.contains('pname')){names[+e.target.dataset.i]=e.target.value.trim()||`Jogador ${+e.target.dataset.i+1}`;leader()}};players.onchange=e=>{if(e.target.classList.contains('typ'))types[+e.target.dataset.i]=e.target.value;if(e.target.classList.contains('sname'))show[+e.target.dataset.i]=e.target.checked};$('p1name').oninput=e=>names[0]=e.target.value.trim()||'Jhon';$('showP1').onchange=e=>show[0]=e.target.checked;$('showAll').onchange=e=>showAll=e.target.checked;$('sound').onclick=e=>{sound=!sound;e.target.textContent=sound?'🔊 Som':'🔇 Som'};$('mode').onchange=e=>mode=e.target.value;$('map').onchange=e=>map=e.target.value;$('series').onchange=e=>series=+e.target.value;$('skin').onchange=e=>skin=+e.target.value;
function occupied(x,y){return snakes.some(s=>s.some(p=>p.x===x&&p.y===y))||dead.some(s=>s.some(p=>p.x===x&&p.y===y))||trail.some(p=>p.x===x&&p.y===y)}function wall(x,y){if(map.includes('Labirinto'))return(x===14||x===15||x===34||x===35)&&y>4&&y<27;if(map.includes('Caos'))return(x*5+y*7)%23===0;if(map.includes('Arena')){let dx=x-25,dy=y-15;return dx*dx+dy*dy<20}return false}function wrap(p){if(!map.includes('Portais'))return p;let q={...p};if(q.x<0)q.x=COL-1;if(q.x>=COL)q.x=0;if(q.y<0)q.y=ROW-1;if(q.y>=ROW)q.y=0;return q}function safe(p){return map.includes('Portais')||(p.x>=0&&p.x<COL&&p.y>=0&&p.y<ROW&&!wall(p.x,p.y))}function foodInit(){foods=[];let n=0;while(foods.length<3&&n++<5000){let f={x:Math.floor(Math.random()*COL),y:Math.floor(Math.random()*ROW)};if(!occupied(f.x,f.y)&&!wall(f.x,f.y)&&!foods.some(q=>q.x===f.x&&q.y===f.y))foods.push(f)}}function opp(a,b){return a.x+b.x===0&&a.y+b.y===0}function setDir(i,d){if(alive[i]&&!opp(dirs[i],d))nextDirs[i]=d}function boostKey(i,c){return i===0&&c==='Space'||i===1&&(c==='ShiftLeft'||c==='ShiftRight')||i===2&&c==='Enter'}document.onkeydown=e=>{if(e.code==='KeyP'&&running){paused=!paused;$('pause').textContent=paused?'▶️':'⏸️'}for(let i=0;i<count;i++)if(types[i]==='human'){let ks=i===0?['ArrowUp','ArrowDown','ArrowLeft','ArrowRight']:i===1?['KeyW','KeyS','KeyA','KeyD']:['KeyI','KeyK','KeyJ','KeyL'];if(ks.includes(e.code)){e.preventDefault();setDir(i,K[e.code])}if(mode==='turbo'&&boostKey(i,e.code)){e.preventDefault();boost[i]=true}}};document.onkeyup=e=>{for(let i=0;i<count;i++)if(boostKey(i,e.code))boost[i]=false};document.querySelectorAll('[data-d]').forEach(b=>b.onpointerdown=e=>{e.preventDefault();setDir(0,{up:K.ArrowUp,down:K.ArrowDown,left:K.ArrowLeft,right:K.ArrowRight}[b.dataset.d])});$('boostTouch').onpointerdown=e=>{e.preventDefault();if(mode==='turbo'){boost[0]=true;$('boostTouch').classList.add('on')}};['pointerup','pointercancel','pointerleave'].forEach(v=>$('boostTouch').addEventListener(v,()=>{boost[0]=fa function startMatch(){score=[0,0,0];round=1;startRound()}function startRound(){clearInterval(timer);snakes=[];dead=[];trail=[];dirs=[];nextDirs=[];alive=Array(count).fill(true);energy=[100,100,100];boost=[false,false,false];paused=false;running=true;$('overlay').classList.add('hidden');let S=[{x:6,y:8,dx:1,dy:0},{x:43,y:22,dx:-1,dy:0},{x:25,y:27,dx:0,dy:-1}];for(let i=0;i<count;i++){let s=S[i];snakes.push([{x:s.x,y:s.y},{x:s.x-s.dx,y:s.y-s.dy},{x:s.x-2*s.dx,y:s.y-2*s.dy}]);dirs.push({x:s.dx,y:s.dy});nextDirs.push({x:s.dx,y:s.dy})}foodInit();ui();draw();timer=setInterval(tick,NORMAL)}function tick(){if(paused||!running)return;for(let i=0;i<count;i++)if(alive[i]){if(types[i]==='cpu')setDir(i,ai(i));if(mode==='turbo'){energy[i]=Math.max(0,Math.min(100,energy[i]+(boost[i]?-2:.5)));if(!energy[i])boost[i]=false}dirs[i]=nextDirs[i]}let heads=snakes.map((s,i)=>alive[i]?wrap({x:s[0].x+dirs[i].x,y:s[0].y+dirs[i].y}):null),deaths=Array(count).fill(false);for(let i=0;i<count;i++)if(alive[i]){let h=heads[i];if(!safe(h)||trail.some(t=>t.x===h.x&&t.y===h.y))deaths[i]=true;for(let j=0;j<count;j++)if(i!==j&&heads[j]&&h.x===heads[j].x&&h.y===heads[j].y)deaths[i]=true;for(let j=0;j<count;j++)if(j!==i&&snakes[j].some(p=>p.x===h.x&&p.y===h.y))deaths[i]=true;if(mode!=='turbo'&&snakes[i].slice(0,-1).some(p=>p.x===h.x&&p.y===h.y))deaths[i]=true;if(dead.some(s=>s.some(p=>p.x===h.x&&p.y===h.y)))deaths[i]=true}for(let i=0;i<count;i++)if(alive[i]){let old=snakes[i].map(p=>({...p}));if(deaths[i]){alive[i]=false;dead.push(old);boost[i]=false;beep(110);continue}let h=heads[i];snakes[i].unshift(h);if(mode==='turbo'&&boost[i]&&snakes[i].length>3)trail.push({x:snakes[i][snakes[i].length-1].x,y:snakes[i][snakes[i].length-1].y,owner:i});let fi=foods.findIndex(f=>f.x===h.x&&f.y===h.y);if(fi>=0){score[i]++;foods.splice(fi,1);while(foods.length<3){let f={x:Math.floor(Math.random()*COL),y:Math.floor(Math.random()*ROW)};if(!occupied(f.x,f.y)&&!wall(f.x,f.y)&&!foods.some(q=>q.x===f.x&&q.y===f.y)){foods.push 'back').onclick=goMenu;function draw(){X.fillStyle='#050911';X.fillRect(0,0,C.width,C.height);let g=X.createRadialGradient(C.width/2,C.height/2,30,C.width/2,C.height/2,C.width*.7);g.addColorStop(0,'#112039');g.addColorStop(1,'#04070d');X.fillStyle=g;X.fillRect(0,0,C.width,C.height);X.strokeStyle='rgba(255,255,255,.04)';for(let i=0;i<=COL;i++){X.beginPath();X.moveTo(i*20,0);X.lineTo(i*20,C.height);X.stroke()}for(let i=0;i<=ROW;i++){X.beginPath();X.moveTo(0,i*20);X.lineTo(C.width,i*20);X.stroke()}if(map.includes('Labirinto')){X.fillStyle='#334765';for(let xx of[14,15,34,35])X.fillRect(xx*20,5*20,20,23*20)}if(map.includes('Caos')){X.fillStyle='#263550';for(let xx=0;xx<COL;xx++)for(let yy=0;yy<ROW;yy++)if(wall(xx,yy))X.fillRect(xx*20,yy*20,20,20)}if(map.includes('Arena')){X.strokeStyle='#4c6088';X.lineWidth=7;X.beginPath();X.arc(C.width/2,C.height/2,Math.sqrt(480)*20,0,Math.PI*2);X.stroke();X.lineWidth=1}if(map.includes('Portais')){X.fillStyle='#9b7cff';for(let p of[{x:2,y:2},{x:COL-3,y:ROW-3}]){X.beginPath();X.arc(p.x*20+10,p.y*20+10,9,0,Math.PI*2);X.fill()}}foods.forEach((f,j)=>{X.fillStyle=['#ffd24d','#ff9f43','#fff28a'][j];X.beginPath();X.arc(f.x*20+10,f.y*20+10,7,0,Math.PI*2);X.fill()});trail.forEach(t=>{X.globalAlpha=.65;X.fillStyle=COLORS[t.owner];X.fillRect(t.x*20+4,t.y*20+4,12,12);X.globalAlpha=1});dead.forEach(s=>s.forEach(p=>{X.globalAlpha=.42;X.fillStyle='#b9c0ca';X.fillRect(p.x*20+4,p.y*20+4,12,12);X.globalAlpha=1}));for(let i=0;i<count;i++)if(alive[i]){snakes[i].forEach(p=>{let co=skinColor(skin,i);X.fillStyle=co;X.beginPath();X.roundRect(p.x*20+2,p.y*20+2,16,16,5);X.fill()});if(show[i]&&(i===0||showAll)){X.fillStyle='#fff';X.font='bold 13px system-ui';X.textAlign='center';X.textBaseline='bottom';X.shadowColor='#000';X.shadowBlur=4;X.fillText(label(i),snakes[i][0].x*20+10,snakes[i][0].y*20-2);X.shadowBlur=0}}}function skinColor(s,i){const sets=[['#67ef8a','#47c96a'],['#7affd2','#25a77d'],['#b9e5ff','#3c84d9'],['#e0b8ff','#8b55dc'],['#ffd59a','#ff6f1e']];re
