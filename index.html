<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"><meta name="theme-color" content="#070b14"><title>🐍 Snake Arena</title><style>:root{--bg:#070b14;--p:#111a2d;--p2:#0b1220;--line:#2d3d5c;--txt:#f8fbff;--muted:#9aa9c4;--green:#67ef8a;--pink:#ff72bd;--blue:#63b3ff;--gold:#ffd24d}*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}html,body{margin:0;min-height:100%;background:radial-gradient(circle at 50% -10%,#263a67,#0b1220 35%,var(--bg) 75%);color:var(--txt);font:15px system-ui,-apple-system,Segoe UI,sans-serif}body{display:flex;justify-content:center;padding:10px;overflow-x:hidden}.app{width:min(96vw,1200px)}h1{text-align:center;margin:0;font-size:clamp(2rem,6vw,3.7rem);letter-spacing:-.04em;text-shadow:0 0 28px #6ae}.sub{text-align:center;color:var(--muted);margin:2px 0 14px}.panel,.arenaBox{background:#11182bf2;border:1px solid var(--line);border-radius:20px;box-shadow:0 18px 60px #0008;backdrop-filter:blur(8px)}.panel{padding:14px}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.card{background:linear-gradient(180deg,#121b30,#0b1322);border:1px solid #293a59;border-radius:15px;padding:14px}.card h2{margin:0 0 8px;font-size:1.05rem}.select,.btn{width:100%;min-height:44px;border-radius:12px;font:inherit;font-weight:800}.select{padding:10px;background:#070e1b;color:#fff;border:1px solid #344563}.btn{padding:10px;border:0;background:var(--green);color:#07100a;cursor:pointer}.btn.alt{background:#293957;color:#fff}.row{display:flex;gap:8px;flex-wrap:wrap}.row>.btn{flex:1;width:auto}.players{display:grid;gap:8px;margin-top:9px}.pl{border:1px solid #2b3955;border-radius:12px;padding:9px;background:#0b1424}.muted{color:var(--muted);font-size:.82rem}.hidden{display:none!important}.top{display:flex;justify-content:space-between;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:9px}.scores{display:flex;gap:7px;flex-wrap:wrap}.score{background:#0b1220;border:1px solid #2a3853;padding:8px 10px;border-radius:10px;font-size:.83rem}.hud{display:flex;align-items:center;gap:9px;background:#0b1220;border:1px solid #293653;border-radius:12px;padding:8px 10px;margin-bottom:9px}.meter{height:9px;flex:1;background:#202b42;border-radius:99px;overflow:hidden}.meter i{display:block;height:100%;width:100%;background:linear-gradient(90deg,#67ef8a,#63b3ff);transition:width .12s}.badge{padding:5px 8px;border-radius:999px;background:#192744;color:#b8d7ff;font-size:.72rem;font-weight:900}.arenaBox{padding:7px;position:relative}.arena{width:100%;aspect-ratio:16/10;border-radius:15px;overflow:hidden;background:#050911}.arena canvas{display:block;width:100%;height:100%;touch-action:none}.overlay{position:absolute;inset:7px;border-radius:15px;background:#02050bdd;display:grid;place-items:center;text-align:center;padding:18px;backdrop-filter:blur(5px)}.overlay h2{font-size:clamp(2rem,7vw,3.1rem);margin:0 0 8px}.overlay p{color:#aeb9cf;margin:0 0 15px}.help{text-align:center;color:#8d99b2;font-size:.76rem;margin:10px 0}.kbd{padding:3px 6px;border:1px solid #394969;border-radius:6px;background:#121a2c}.touch{display:none;position:relative;height:148px;margin-top:8px;user-select:none}.dpad{position:absolute;left:4px;bottom:2px;display:grid;grid-template-columns:repeat(3,52px);grid-template-rows:repeat(3,42px);gap:6px}.tbtn{border:1px solid #3d5075;background:#1a2946;color:#fff;border-radius:12px;font-size:1.1rem}.boost{position:absolute;right:5px;bottom:5px;width:98px;height:98px;border-radius:50%;border:2px solid #ffd24d66;background:radial-gradient(circle,#49370f,#17150d 68%);color:#ffd24d;font-weight:900;box-shadow:0 0 28px #ffd24d33}.boost.active{transform:scale(.96);box-shadow:0 0 40px #ffd24d99}@media(max-width:900px){.grid{grid-template-columns:1fr}.touch{display:block}.arena{aspect-ratio:4/3}}@media(max-width:600px){body{padding:6px}.panel{padding:10px}.arena{aspect-ratio:3/4;max-height:62vh}.touch{height:142px}.dpad{grid-template-columns:repeat(3,48px);grid-template-rows:repeat(3,39px)}.boost{width:90px;height:90px}.score{flex:1;min-width:88px}.hud{font-size:.78rem}}@media(orientation:landscape) and (max-height:620px) and (pointer:coarse){.arena{aspect-ratio:16/9;max-height:62vh}.touch{height:105px}.dpad{grid-template-rows:repeat(3,32px)}.boost{width:74px;height:74px}}</style></head><body><div class="app"><h1>🐍 Snake Arena</h1><p class="sub">Até 3 jogadores • Humanos ou CPU • Turbo • Power-ups</p><section id="menu" class="panel"><div class="grid"><div class="card"><h2>👥 Jogadores</h2><select id="count" class="select"><option value="1">1 jogador</option><option value="2" selected>2 jogadores</option><option value="3">3 jogadores</option></select><div id="players" class="players"></div></div><div class="card"><h2>🎮 Modo</h2><select id="mode" class="select"><option value="classic">🏆 Clássico</option><option value="turbo">⚡ Turbo Worms</option><option value="survival">💀 Sobrevivência</option><option value="collection">💎 Coleta</option><option value="king">👑 Rei da Arena</option><option value="race">🏁 Corrida</option></select><select id="map" class="select" style="margin-top:8px"><option value="classic">🟢 Clássico</option><option value="maze">🧱 Labirinto</option><option value="arena">⭕ Arena</option><option value="portals">🌀 Portais</option><option value="chaos">🌋 Caos</option></select><select id="series" class="select" style="margin-top:8px"><option value="1">1 rodada</option><option value="3">Melhor de 3</option><option value="5">Melhor de 5</option></select><div class="row" style="margin-top:9px"><button id="start" class="btn">🚀 Jogar</button><button id="sound" class="btn alt">🔊 Som</button></div></div><div class="card"><h2>🎨 Skin & 🏅 Ranking</h2><select id="skin" class="select"><option value="0">🟢 Neon</option><option value="1">🩷 Rosa</option><option value="2">🔵 Azul</option><option value="3">🟣 Cósmica</option><option value="4">🟠 Fogo</option></select><div id="leader" style="margin-top:9px"></div><div class="muted" style="margin-top:8px">📱 No celular: use o direcional e segure ⚡ TURBO.</div></div></div></section><section id="game" class="hidden"><div class="top"><div id="scores" class="scores"></div><div class="row"><button id="pause" class="btn alt">⏸️</button><button id="restart" class="btn">🔄</button><button id="back" class="btn alt">🏠</button></div></div><div class="hud"><span id="modeBadge" class="badge">🏆 CLÁSSICO</span><span>⚡ P1</span><div class="meter"><i id="energyBar"></i></div><b id="energyText">100%</b><span>Rodada <b id="roundInfo">1/1</b></span></div><div class="arenaBox"><div class="arena"><canvas id="c" width="1000" height="625"></canvas><div id="overlay" class="overlay hidden"><div><h2 id="ot">Fim</h2><p id="ox"></p><button id="next" class="btn">Continuar</button></div></div></div></div><div class="touch"><div class="dpad"><span></span><button class="tbtn" data-dir="up">▲</button><span></span><button class="tbtn" data-dir="left">◀</button><button class="tbtn" data-dir="down">▼</button><button class="tbtn" data-dir="right">▶</button></div><button id="boostTouch" class="boost">⚡<br>TURBO</button></div><p class="help">P1 <span class="kbd">↑↓←→ + Espaço</span> • P2 <span class="kbd">WASD + Shift</span> • P3 <span class="kbd">IJKL + Enter</span> • <span class="kbd">P</span> pausa</p></section></div><script>
const c=document.getElementById('c'),ctx=c.getContext('2d'),menu=document.getElementById('menu'),game=document.getElementById('game'),players=document.getElementById('players'),scores=document.getElementById('scores'),overlay=document.getElementById('overlay'),ot=document.getElementById('ot'),ox=document.getElementById('ox'),next=document.getElementById('next');const COL=50,ROW=31,CELL=20,N=105,T=58,base=['#67ef8a','#ff72bd','#63b3ff'];let count=2,types=['human','human','cpu'],mode='classic',map='classic',series=1,skin=0,sn=[],dead=[],trail=[],foods=[],powers=[],dir=[],ndir=[],alive=[],boost=[false,false,false],energy=[100,100,100],score=[0,0,0],round=1,timer=null,running=false,paused=false,sound=true,ac=null,xp=load('sx',[0,0,0]),lvl=load('sl',[1,1,1]),wins=load('sw',[0,0,0]),rec=load('sr',[0,0,0]);function load(k,d){try{return JSON.parse(localStorage.getItem(k))||d}catch(e){return d}}function save(){localStorage.setItem('sx',JSON.stringify(xp));localStorage.setItem('sl',JSON.stringify(lvl));localStorage.setItem('sw',JSON.stringify(wins));localStorage.setItem('sr',JSON.stringify(rec))}function beep(f=440,d=.06){if(!sound)return;try{ac??=new(window.AudioContext||window.webkitAudioContext)();let o=ac.createOscillator(),g=ac.createGain();o.frequency.value=f;o.type='square';g.gain.value=.018;o.connect(g);g.connect(ac.destination);o.start();g.gain.exponentialRampToValueAtTime(.001,ac.currentTime+d);o.stop(ac.currentTime+d)}catch(e){}}
function makePlayers(){players.innerHTML='';for(let i=0;i<count;i++){let d=document.createElement('div');d.className='pl';d.innerHTML=`<b>${['🟢','🩷','🔵'][i]} Jogador ${i+1}</b><select class="select typ" data-i="${i}" style="margin-top:6px"><option value="human" ${types[i]==='human'?'selected':''}>👤 Humano</option><option value="cpu" ${types[i]==='cpu'?'selected':''}>🤖 CPU</option></select><div class="muted" style="margin-top:4px">${i===0?'Setas + Espaço':i===1?'W A S D + Shift':'I J K L + Enter'}</div>`;players.appendChild(d)}}document.getElementById('count').onchange=e=>{count=+e.target.value;types=count===1?['human','cpu','cpu']:count===2?['human','human','cpu']:['human','human','human'];makePlayers()};makePlayers();players.onchange=e=>{if(e.target.classList.contains('typ'))types[+e.target.dataset.i]=e.target.value};document.getElementById('mode').onchange=e=>mode=e.target.value;document.getElementById('map').onchange=e=>map=e.target.value;document.getElementById('series').onchange=e=>series=+e.target.value;document.getElementById('skin').onchange=e=>skin=+e.target.value;document.getElementById('sound').onclick=e=>{sound=!sound;e.target.textContent=sound?'🔊 Som':'🔇 Som'};function gain(i,n){xp[i]+=n;let need=lvl[i]*50;while(xp[i]>=need){xp[i]-=need;lvl[i]++;need=lvl[i]*50;beep(900,.1)}save();leader()}function leader(){let a=[0,1,2].map(i=>({i,l:lvl[i],w:wins[i],r:rec[i]})).sort((a,b)=>b.w-a.w||b.r-a.r);document.getElementById('leader').innerHTML='<b>🏅 Ranking local</b><br>'+a.map((q,k)=>`${k+1}º ${['🟢','🩷','🔵'][q.i]} Nv ${q.l} • ${q.w} vit. • record ${q.r}`).join('<br>')}leader();
function occupied(px,py){return sn.some(s=>s.some(p=>p.x===px&&p.y===py))||dead.some(s=>s?.some(p=>p.x===px&&p.y===py))||trail.some(p=>p.x===px&&p.y===py)}function blocked(px,py){if(map==='maze')return(px===14||px===15||px===34||px===35)&&py>4&&py<27;if(map==='arena'){let dx=px-COL/2,dy=py-ROW/2;return dx*dx+dy*dy<20}if(map==='chaos')return(px*5+py*7)%23===0;return false}function wrap(p){if(map!=='portals')return p;let q={...p};if(q.x<0)q.x=COL-1;if(q.x>=COL)q.x=0;if(q.y<0)q.y=ROW-1;if(q.y>=ROW)q.y=0;return q}function safe(p){return map==='portals'||(p.x>=0&&p.x<COL&&p.y>=0&&p.y<ROW&&!blocked(p.x,p.y))}function foodsInit(){foods=[];while(foods.length<3){let f={x:Math.floor(Math.random()*COL),y:Math.floor(Math.random()*ROW)};if(!occupied(f.x,f.y)&&!blocked(f.x,f.y)&&!foods.some(q=>q.x===f.x&&q.y===f.y))foods.push(f)}}function spawnPower(){if(Math.random()<.05&&powers.length<4){let t=['shield','magnet','freeze','shrink','mega'][Math.floor(Math.random()*5)],p={x:Math.floor(Math.random()*COL),y:Math.floor(Math.random()*ROW),t};if(!occupied(p.x,p.y)&&!blocked(p.x,p.y))powers.push(p)}}function opposite(a,b){return a.x+b.x===0&&a.y+b.y===0}function setDir(i,d){if(!opposite(dir[i],d))ndir[i]=d}
const km={ArrowUp:{x:0,y:-1},ArrowDown:{x:0,y:1},ArrowLeft:{x:-1,y:0},ArrowRight:{x:1,y:0},KeyW:{x:0,y:-1},KeyS:{x:0,y:1},KeyA:{x:-1,y:0},KeyD:{x:1,y:0},KeyI:{x:0,y:-1},KeyK:{x:0,y:1},KeyJ:{x:-1,y:0},KeyL:{x:1,y:0}};function boostKey(i,c){return i===0&&c==='Space'||i===1&&(c==='ShiftLeft'||c==='ShiftRight')||i===2&&c==='Enter'}document.addEventListener('keydown',e=>{if(e.code==='KeyP'&&running){paused=!paused;document.getElementById('pause').textContent=paused?'▶️':'⏸️'}for(let i=0;i<count;i++){if(types[i]==='human'){let ks=i===0?['ArrowUp','ArrowDown','ArrowLeft','ArrowRight']:i===1?['KeyW','KeyS','KeyA','KeyD']:['KeyI','KeyK','KeyJ','KeyL'];if(ks.includes(e.code)){e.preventDefault();setDir(i,km[e.code])}}if(mode==='turbo'&&types[i]==='human'&&boostKey(i,e.code)){e.preventDefault();boost[i]=true}}});document.addEventListener('keyup',e=>{for(let i=0;i<count;i++)if(boostKey(i,e.code))boost[i]=false});const bt=document.getElementById('boostTouch');bt.addEventListener('pointerdown',e=>{e.preventDefault();boost[0]=true;bt.classList.add('active')});['pointerup','pointercancel','pointerleave'].forEach(v=>bt.addEventListener(v,e=>{boost[0]=false;bt.classList.remove('active')}));document.querySelectorAll('[data-dir]').forEach(b=>b.addEventListener('pointerdown',e=>{e.preventDefault();setDir(0,km[{up:'ArrowUp',down:'ArrowDown',left:'ArrowLeft',right:'ArrowRight'}[b.dataset.dir]])}));
function ai(i){let h=sn[i][0],opts=[dir[i],{x:0,y:-1},{x:0,y:1},{x:-1,y:0},{x:1,y:0}].filter(d=>!opposite(d,dir[i])),best=dir[i],bv=-1e9,target=foods.reduce((a,b)=>!a||Math.abs(a.x-h.x)+Math.abs(a.y-h.y)<Math.abs(b.x-h.x)+Math.abs(b.y-h.y)?a:b,null);for(let d of opts){let p=wrap({x:h.x+d.x,y:h.y+d.y}),v=target?-Math.abs(p.x-target.x)-Math.abs(p.y-target.y):0;if(!safe(p))v-=1e5;if(occupiedOther(i,p.x,p.y))v-=2e4;if(trail.some(t=>t.x===p.x&&t.y===p.y))v-=8e3;if(powers.some(q=>q.x===p.x&&q.y===p.y))v+=500;if(v>bv){bv=v;best=d}}if(mode==='turbo'&&Math.random()<.03&&energy[i]>30)boost[i]=true;return best}function occupiedOther(i,px,py){for(let j=0;j<count;j++)if(j!==i&&sn[j].some(p=>p.x===px&&p.y===py))return true;return false}
function startMatch(){score=[0,0,0];round=1;startRound()}function startRound(){clearInterval(timer);sn=[];dead=[];trail=[];powers=[];dir=[];ndir=[];alive=Array(count).fill(true);energy=[100,100,100];boost=[false,false,false];paused=false;running=true;overlay.classList.add('hidden');const starts=[{x:6,y:8,dx:1,dy:0},{x:43,y:22,dx:-1,dy:0},{x:25,y:27,dx:0,dy:-1}];for(let i=0;i<count;i++){let s=starts[i];sn.push([{x:s.x,y:s.y},{x:s.x-s.dx,y:s.y-s.dy},{x:s.x-2*s.dx,y:s.y-2*s.dy}]);dir.push({x:s.dx,y:s.dy});ndir.push({x:s.dx,y:s.dy})}foodsInit();document.getElementById('roundInfo').textContent=`${round}/${series}`;document.getElementById('modeBadge').textContent=mode==='turbo'?'⚡ TURBO WORMS':mode==='survival'?'💀 SOBREVIVÊNCIA':mode==='collection'?'💎 COLETA':mode==='king'?'👑 REI DA ARENA':mode==='race'?'🏁 CORRIDA':'🏆 CLÁSSICO';renderScores();updateEnergy();draw();timer=setInterval(tick,NORMAL)}function updateEnergy(){let v=Math.round(energy[0]);document.getElementById('energyBar').style.width=v+'%';document.getElementById('energyText').textContent=v+'%'}
function applyPower(i,t){gain(i,20);beep(950,.08);if(t==='shield')energy[i]=100;if(t==='magnet'){for(let f of foods)if(Math.abs(f.x-sn[i][0].x)+Math.abs(f.y-sn[i][0].y)<9)score[i]++}if(t==='freeze')freezeUntil=performance.now()+1800;if(t==='shrink')sn[i]=sn[i].slice(0,Math.max(3,Math.floor(sn[i].length*.55)));if(t==='mega'){score[i]+=3;sn[i].push({...sn[i][sn[i].length-1})}}let freezeUntil=0;
function tick(){if(paused||!running)return;spawnPower();for(let i=0;i<count;i++)if(alive[i]){if(types[i]==='cpu')setDir(i,ai(i));if(mode==='turbo'){if(boost[i])energy[i]=Math.max(0,energy[i]-1.7);else energy[i]=Math.min(100,energy[i]+.55);if(energy[i]<=0)boost[i]=false}dir[i]=ndir[i]}let heads=sn.map((s,i)=>alive[i]?wrap({x:s[0].x+dir[i].x,y:s[0].y+dir[i].y}):null),deaths=Array(count).fill(false);for(let i=0;i<count;i++){if(!alive[i])continue;let h=heads[i];if(!safe(h)||trail.some(t=>t.x===h.x&&t.y===h.y))deaths[i]=true;for(let j=0;j<count;j++)if(i!==j&&heads[j]&&h.x===heads[j].x&&h.y===heads[j].y)deaths[i]=true;for(let j=0;j<count;j++)if(j!==i&&sn[j].some(p=>p.x===h.x&&p.y===h.y))deaths[i]=true;if(mode!=='turbo'&&sn[i].slice(0,-1).some(p=>p.x===h.x&&p.y===h.y))deaths[i]=true;if(dead.some(s=>s?.some(p=>p.x===h.x&&p.y===h.y)))deaths[i]=true}
for(let i=0;i<count;i++)if(alive[i]){let old=sn[i].map(p=>({...p}));if(deaths[i]){alive[i]=false;dead.push(old);boost[i]=false;gain(i,25);beep(120,.12);continue}let h=heads[i];sn[i].unshift(h);if(mode==='turbo'&&boost[i]&&sn[i].length>3)trail.push({x:sn[i][sn[i].length-1].x,y:sn[i][sn[i].length-1].y,owner:i});let fi=foods.findIndex(f=>f.x===h.x&&f.y===h.y);if(fi>=0){score[i]++;gain(i,10);foods.splice(fi,1);while(foods.length<3){let f={x:Math.floor(Math.random()*COL),y:Math.floor(Math.random()*ROW)};if(!occupied(f.x,f.y)&&!blocked(f.x,f.y)&&!foods.some(q=>q.x===f.x&&q.y===f.y)){foods.push(f);break}}beep(720,.05)}let pi=powers.findIndex(p=>p.x===h.x&&p.y===h.y);if(pi>=0){applyPower(i,powers[pi].t);powers.splice(pi,1)}else sn[i].pop();if(mode==='collection'&&score[i]>=10){endRound();return}if(mode==='race'&&sn[i].length>=30){endRound();return}if(mode==='king'&&h.x>20&&h.x<30&&h.y>10&&h.y<21)score[i]++}if(trail.length>1200)trail.splice(0,100);if(alive.filter(Boolean).length<=1){endRound();return}draw();renderScores();updateEnergy()}
function endRound(){clearInterval(timer);running=false;let w=alive.findIndex(Boolean);if(w<0)w=score.slice(0,count).indexOf(Math.max(...score.slice(0,count)));if(w>=0){score[w]++;wins[w]++;rec[w]=Math.max(rec[w],score[w]);gain(w,50)}save();ot.textContent=w>=0?`🏆 ${label(w)} venceu!`:'🤝 Empate!';ox.textContent=`Rodada ${round} • 3 comidas ativas • corpos permanecem no mapa`;next.textContent=round<series?'➡️ Próxima rodada':'🏅 Resultado final';next.onclick=round<series?nextRound:final;overlay.classList.remove('hidden')}function nextRound(){round++;startRound()}function final(){let m=Math.max(...score.slice(0,count)),ws=[];for(let i=0;i<count;i++)if(score[i]===m)ws.push(label(i));ot.textContent=ws.length>1?'🤝 Empate final!':`👑 ${ws[0]} campeão!`;ox.textContent=`Placar: ${score.slice(0,count).join(' • ')}`;next.textContent='🔄 Nova partida';next.onclick=startMatch}function label(i){return `Jogador ${i+1}${types[i]==='cpu'?' 🤖':' 👤'}`}function renderScores(){scores.innerHTML='';for(let i=0;i<count;i++){let d=document.createElement('div');d.className='score';d.innerHTML=`${['🟢','🩷','🔵'][i]} ${label(i)}: <b>${score[i]}</b> • Nv ${lvl[i]}`;scores.appendChild(d)}}function draw(){ctx.fillStyle='#050911';ctx.fillRect(0,0,c.width,c.height);let g=ctx.createRadialGradient(c.width/2,c.height/2,30,c.width/2,c.height/2,c.width*.72);g.addColorStop(0,'#13223a');g.addColorStop(1,'#03060b');ctx.fillStyle=g;ctx.fillRect(0,0,c.width,c.height);ctx.strokeStyle='rgba(255,255,255,.035)';for(let i=0;i<=COL;i++){ctx.beginPath();ctx.moveTo(i*CELL,0);ctx.lineTo(i*CELL,c.height);ctx.stroke()}for(let i=0;i<=ROW;i++){ctx.beginPath();ctx.moveTo(0,i*CELL);ctx.lineTo(c.width,i*CELL);ctx.stroke()}if(map==='maze'){ctx.fillStyle='#344663';for(let xx of[14,15,34,35])ctx.fillRect(xx*CELL,5*CELL,CELL,22*CELL)}if(map==='arena'){ctx.strokeStyle='#4c6088';ctx.lineWidth=7;ctx.beginPath();ctx.arc(c.width/2,c.height/2,Math.sqrt(480)*CELL,0,Math.PI*2);ctx.stroke();ctx.lineWidth=1}if(map==='portals'){ctx.fillStyle='#9b7cff';for(let p of[{x:2,y:2},{x:COL-3,y:ROW-3}]){ctx.beginPath();ctx.arc(p.x*CELL+10,p.y*CELL+10,9,0,Math.PI*2);ctx.fill()}}foods.forEach((f,j)=>{ctx.save();ctx.shadowBlur=18;ctx.shadowColor='#ffd24d';ctx.fillStyle=j===0?'#ffd24d':j===1?'#ff9f43':'#fff28a';ctx.beginPath();ctx.arc(f.x*CELL+10,f.y*CELL+10,7,0,Math.PI*2);ctx.fill();ctx.restore()});const pcol=['#dbe4ff','#ffd24d','#8be0ff','#c796ff','#ff9f43'];powers.forEach(p=>{ctx.save();let co=pcol[['shield','magnet','freeze','shrink','mega'].indexOf(p.t)];ctx.shadowBlur=20;ctx.shadowColor=co;ctx.fillStyle=co;ctx.beginPath();ctx.arc(p.x*CELL+10,p.y*CELL+10,8,0,Math.PI*2);ctx.fill();ctx.restore()});trail.forEach(t=>{ctx.globalAlpha=.7;ctx.fillStyle=base[t.owner];ctx.fillRect(t.x*CELL+3,t.y*CELL+3,CELL-6,CELL-6);ctx.globalAlpha=1});dead.forEach(s=>s?.forEach(p=>{ctx.fillStyle='#b9c0d044';ctx.fillRect(p.x*CELL+4,p.y*CELL+4,CELL-8,CELL-8)}));for(let i=0;i<count;i++)if(alive[i])sn[i].forEach((p,k)=>{let co=base[(i+skin)%base.length];ctx.fillStyle=co;ctx.globalAlpha=k?0.82:1;ctx.shadowBlur=k===0?15:0;ctx.shadowColor=co;ctx.beginPath();ctx.roundRect(p.x*CELL+2,p.y*CELL+2,CELL-4,CELL-4,6);ctx.fill();ctx.shadowBlur=0;ctx.globalAlpha=1;if(k===0){ctx.fillStyle='#06100a';ctx.beginPath();ctx.arc(p.x*CELL+6,p.y*CELL+6,2.2,0,Math.PI*2);ctx.fill();ctx.beginPath();ctx.arc(p.x*CELL+14,p.y*CELL+6,2.2,0,Math.PI*2);ctx.fill()}})}
function startGame(){menu.classList.add('hidden');game.classList.remove('hidden');startMatch()}function goMenu(){clearInterval(timer);running=false;game.classList.add('hidden');menu.classList.remove('hidden');overlay.classList.add('hidden');leader()}document.getElementById('start').onclick=startGame;document.getElementById('pause').onclick=()=>{paused=!paused;document.getElementById('pause').textContent=paused?'▶️':'⏸️'};document.getElementById('restart').onclick=startRound;document.getElementById('back').onclick=goMenu;
</script></body></html>
