<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>🐍 Snake Arena</title><style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(circle at top,#1d2b4b,#070b14 70%);color:#f7f8ff;font:15px system-ui,Segoe UI,sans-serif;display:grid;place-items:center;padding:16px}.app{width:min(96vw,1200px)}h1{text-align:center;font-size:clamp(2rem,5vw,3.5rem);margin:0}.sub{text-align:center;color:#aab5cb;margin:4px 0 14px}.panel,.arena{background:#11182bf2;border:1px solid #30405f;border-radius:18px;padding:16px;box-shadow:0 18px 50px #0007}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.card{background:#0d1424;border:1px solid #2b3955;border-radius:14px;padding:14px}.card h2{margin:0 0 8px}.select,.btn{width:100%;padding:10px;border-radius:10px;font:inherit;font-weight:800}.select{background:#080f1d;color:#fff;border:1px solid #344463}.btn{border:0;background:#72e28d;color:#07100a;cursor:pointer}.btn.alt{background:#2a3956;color:#fff}.row{display:flex;gap:8px;flex-wrap:wrap}.row>.btn{width:auto}.players{display:grid;gap:8px;margin-top:10px}.p{border:1px solid #2b3955;border-radius:12px;padding:10px}.muted{color:#9ca9c4;font-size:.85rem}.hidden{display:none!important}.top{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;margin-bottom:10px}.scores{display:flex;gap:8px;flex-wrap:wrap}.score{background:#0b1220;border:1px solid #2a3853;border-radius:10px;padding:8px 10px}.hud{display:flex;align-items:center;gap:10px;padding:9px;background:#0b1220;border:1px solid #293653;border-radius:12px;margin-bottom:10px}.meter{height:10px;flex:1;background:#202b42;border-radius:20px;overflow:hidden}.meter i{display:block;height:100%;width:100%;background:#63b3ff}.arena{padding:8px;position:relative}.arena canvas{display:block;width:100%;height:auto;aspect-ratio:10/7;background:#060a12;border-radius:11px}.overlay{position:absolute;inset:8px;background:#03060bd9;border-radius:11px;display:grid;place-items:center;text-align:center;padding:20px}.overlay h2{font-size:2.5rem;margin:0 0 8px}.help{text-align:center;color:#8d99b2}.kbd{padding:3px 7px;border:1px solid #394969;border-radius:6px;background:#121a2c}.touch{display:none;justify-content:center;margin-top:10px}.dpad{display:grid;grid-template-columns:repeat(3,60px);gap:7px}.dpad button{height:50px}@media(max-width:850px){.grid{grid-template-columns:1fr}.touch{display:flex}}
</style></head><body><div class="app"><h1>🐍 Snake Arena</h1><p class="sub">Até 3 jogadores • CPU • Power-ups • XP • Skins • Mapas • Modos</p>
<section id="menu" class="panel"><div class="grid">
<div class="card"><h2>👥 Jogadores</h2><select id="count" class="select"><option value="1">1 jogador</option><option value="2" selected>2 jogadores</option><option value="3">3 jogadores</option></select><div id="players" class="players"></div></div>
<div class="card"><h2>🎮 Modo</h2><select id="mode" class="select"><option value="classic">🏆 Clássico</option><option value="turbo">⚡ Turbo Worms</option><option value="survival">💀 Sobrevivência</option><option value="collection">💎 Coleta</option><option value="king">👑 Rei da Arena</option><option value="race">🏁 Corrida</option></select><select id="map" class="select" style="margin-top:8px"><option value="classic">🟢 Clássico</option><option value="maze">🧱 Labirinto</option><option value="arena">⭕ Arena</option><option value="portals">🌀 Portais</option><option value="chaos">🌋 Caos</option></select><select id="series" class="select" style="margin-top:8px"><option value="1">1 rodada</option><option value="3">Melhor de 3</option><option value="5">Melhor de 5</option></select><div class="row" style="margin-top:9px"><button id="start" class="btn">🚀 Jogar</button><button id="sound" class="btn alt">🔊 Som</button></div><div class="muted" style="margin-top:8px">🌐 Multiplayer online real exige servidor; esta versão é local/CPU.</div></div>
<div class="card"><h2>🎨 Skins & 🏅 Ranking</h2><select id="skin" class="select"><option value="0">🟢 Neon</option><option value="1">🩷 Rosa</option><option value="2">🔵 Azul</option><option value="3">🟣 Cósmica</option><option value="4">🟠 Fogo</option></select><div id="leader" style="margin-top:10px"></div></div>
</div></section>
<section id="game" class="hidden"><div class="top"><div id="scores" class="scores"></div><div class="row"><button id="pause" class="btn alt">⏸️</button><button id="restart" class="btn">🔄</button><button id="back" class="btn alt">🏠</button></div></div><div class="hud"><span>⚡ P1</span><div class="meter"><i id="energy"></i></div><b id="energyTxt">100%</b><span>Rodada <b id="rinfo">1/1</b></span></div><div class="arena"><canvas id="c" width="1000" height="700"></canvas><div id="overlay" class="overlay hidden"><div><h2 id="ot">Fim</h2><p id="ox"></p><button id="next" class="btn">Continuar</button></div></div></div><div class="touch"><div class="dpad"><span></span><button class="btn" data-k="ArrowUp">▲</button><span></span><button class="btn" data-k="ArrowLeft">◀</button><button class="btn" data-k="ArrowDown">▼</button><button class="btn" data-k="ArrowRight">▶</button></div></div><p class="help">P1: <span class="kbd">↑↓←→ + Espaço</span> • P2: <span class="kbd">WASD + Shift</span> • P3: <span class="kbd">IJKL + Enter</span> • <span class="kbd">P</span> pausa</p></section></div>
<script>
const c=document.getElementById('c'),x=c.getContext('2d'),menu=document.getElementById('menu'),game=document.getElementById('game'),players=document.getElementById('players'),scores=document.getElementById('scores'),ov=document.getElementById('overlay'),ot=document.getElementById('ot'),ox=document.getElementById('ox'),next=document.getElementById('next'),COL=50,ROW=35,CELL=20,N=105,T=58,baseColors=['#67ef8a','#ff72bd','#63b3ff'];let count=2,types=['human','human','cpu'],mode='classic',map='classic',series=1,skin=0,sn=[],dead=[],trail=[],foods=[],powers=[],dir=[],ndir=[],alive=[],boost=[false,false,false],energy=[100,100,100],score=[0,0,0],round=1,timer=null,running=false,paused=false,sound=true,ac=null,xp=JSON.parse(localStorage.getItem('snakeXP')||'[0,0,0]'),lvl=JSON.parse(localStorage.getItem('snakeLVL')||'[1,1,1]'),wins=JSON.parse(localStorage.getItem('snakeWINS')||'[0,0,0]'),record=JSON.parse(localStorage.getItem('snakeREC')||'[0,0,0]');
function save(){localStorage.setItem('snakeXP',JSON.stringify(xp));localStorage.setItem('snakeLVL',JSON.stringify(lvl));localStorage.setItem('snakeWINS',JSON.stringify(wins));localStorage.setItem('snakeREC',JSON.stringify(record))}function beep(f=440,d=.06){if(!sound)return;try{ac??=new(window.AudioContext||window.webkitAudioContext)();let o=ac.createOscillator(),g=ac.createGain();o.type='square';o.frequency.value=f;g.gain.value=.02;o.connect(g);g.connect(ac.destination);o.start();g.gain.exponentialRampToValueAtTime(.001,ac.currentTime+d);o.stop(ac.currentTime+d)}catch(e){}}
function makePlayers(){players.innerHTML='';for(let i=0;i<count;i++){let d=document.createElement('div');d.className='p';d.innerHTML=`<b>${['🟢','🩷','🔵'][i]} Jogador ${i+1}</b><select class="select typ" data-i="${i}"><option value="human" ${types[i]==='human'?'selected':''}>👤 Humano</option><option value="cpu" ${types[i]==='cpu'?'selected':''}>🤖 CPU</option></select><div class="muted">${i===0?'Setas + Espaço':i===1?'W A S D + Shift':'I J K L + Enter'}</div>`;players.appendChild(d)}}document.getElementById('count').onchange=e=>{count=+e.target.value;types=count===1?['human','cpu','cpu']:count===2?['human','human','cpu']:['human','human','human'];makePlayers()};makePlayers();players.onchange=e=>{if(e.target.classList.contains('typ'))types[+e.target.dataset.i]=e.target.value};document.getElementById('mode').onchange=e=>mode=e.target.value;document.getElementById('map').onchange=e=>map=e.target.value;document.getElementById('series').onchange=e=>series=+e.target.value;document.getElementById('skin').onchange=e=>skin=+e.target.value;document.getElementById('sound').onclick=e=>{sound=!sound;e.target.textContent=sound?'🔊 Som':'🔇 Som'};
function gain(i,n){xp[i]+=n;let need=lvl[i]*50;while(xp[i]>=need){xp[i]-=need;lvl[i]++;need=lvl[i]*50;beep(900,.1)}save();leader()}
function leader(){let a=[0,1,2].map(i=>({i,l:lvl[i],w:wins[i],r:record[i]})).sort((a,b)=>b.w-a.w||b.r-a.r);document.getElementById('leader').innerHTML='<b>🏆 Ranking</b><br>'+a.map((q,k)=>`${k+1}º ${['🟢','🩷','🔵'][q.i]} Nv ${q.l} • ${q.w} vit. • record ${q.r}`).join('<br>')}
leader();function occupied(px,py){return sn.some(s=>s.some(p=>p.x===px&&p.y===py))||dead.some(s=>s?.some(p=>p.x===px&&p.y===py))||trail.some(p=>p.x===px&&p.y===py)}function blocked(px,py){if(map==='maze')return (px===14||px===15||px===34||px===35)&&py>5&&py<29;if(map==='arena'){let dx=px-COL/2,dy=py-ROW/2;return dx*dx+dy*dy<25}if(map==='chaos')return(px*3+py*5)%17===0;return false}function wrap(p){if(map!=='portals')return p;let q={...p};if(q.x<0)q.x=COL-1;if(q.x>=COL)q.x=0;if(q.y<0)q.y=ROW-1;if(q.y>=ROW)q.y=0;return q}function safe(p){return map==='portals'||(p.x>=0&&p.x<COL&&p.y>=0&&p.y<ROW&&!blocked(p.x,p.y))}
function foodsInit(){foods=[];while(foods.length<3){let f={x:Math.floor(Math.random()*COL),y:Math.floor(Math.random()*ROW)};if(!occupied(f.x,f.y)&&!blocked(f.x,f.y)&&!foods.some(q=>q.x===f.x&&q.y===f.y))foods.push(f)}}function spawnPower(){if(Math.random()<.08&&powers.length<4){let ts=['shield','magnet','freeze','shrink','mega'];let p={x:Math.floor(Math.random()*COL),y:Math.floor(Math.random()*ROW),t:ts[Math.floor(Math.random()*ts.length)]};if(!occupied(p.x,p.y)&&!blocked(p.x,p.y))powers.push(p)}}function opposite(a,b){return a.x+b.x===0&&a.y+b.y===0}function setDir(i,d){if(!opposite(dir[i],d))ndir[i]=d}
const km={ArrowUp:{x:0,y:-1},ArrowDown:{x:0,y:1},ArrowLeft:{x:-1,y:0},ArrowRight:{x:1,y:0},KeyW:{x:0,y:-1},KeyS:{x:0,y:1},KeyA:{x:-1,y:0},KeyD:{x:1,y:0},KeyI:{x:0,y:-1},KeyK:{x:0,y:1},KeyJ:{x:-1,y:0},KeyL:{x:1,y:0}};function bkey(i,c){return i===0&&c==='Space'||i===1&&(c==='ShiftLeft'||c==='ShiftRight')||i===2&&c==='Enter'}
document.addEventListener('keydown',e=>{if(e.code==='KeyP'&&running){paused=!paused;document.getElementById('pause').textContent=paused?'▶️':'⏸️'}if(e.code==='Enter'&&!ov.classList.contains('hidden'))next.click();for(let i=0;i<count;i++){if(types[i]==='human'){let ks=i===0?['ArrowUp','ArrowDown','ArrowLeft','ArrowRight']:i===1?['KeyW','KeyS','KeyA','KeyD']:['KeyI','KeyK','KeyJ','KeyL'];if(ks.includes(e.code)){e.preventDefault();setDir(i,km[e.code])}}if(mode==='turbo'&&types[i]==='human'&&bkey(i,e.code)){e.preventDefault();boost[i]=true}}});document.addEventListener('keyup',e=>{for(let i=0;i<count;i++)if(bkey(i,e.code))boost[i]=false});document.querySelectorAll('[data-k]').forEach(b=>b.onclick=()=>setDir(0,km[b.dataset.k]));
function ai(i){let h=sn[i][0],opts=[dir[i],{x:0,y:-1},{x:0,y:1},{x:-1,y:0},{x:1,y:0}].filter(d=>!opposite(d,dir[i])),best=dir[i],bv=-1e9,target=foods.sort((a,b)=>Math.abs(a.x-h.x)+Math.abs(a.y-h.y)-(Math.abs(b.x-h.x)+Math.abs(b.y-h.y)))[0];for(let d of opts){let p=wrap({x:h.x+d.x,y:h.y+d.y}),v=target?-Math.abs(p.x-target.x)-Math.abs(p.y-target.y):0;if(!safe(p))v-=1e5;if(occupiedOther(i,p.x,p.y))v-=2e4;if(powers.some(q=>q.x===p.x&&q.y===p.y))v+=600;if(v>bv){bv=v;best=d}}if(mode==='turbo'&&Math.random()<.04&&energy[i]>25)boost[i]=true;return best}function occupiedOther(i,px,py){for(let j=0;j<count;j++)if(j!==i&&sn[j].some(p=>p.x===px&&p.y===py))return true;return false}
function startMatch(){score=[0,0,0];round=1;startRound()}function startRound(){clearInterval(timer);sn=[];dead=[];trail=[];powers=[];dir=[];ndir=[];alive=Array(count).fill(true);energy=Array(3).fill(100);boost=Array(3).fill(false);paused=false;running=true;ov.classList.add('hidden');const s=[{x:6,y:8,dx:1,dy:0},{x:43,y:26,dx:-1,dy:0},{x:25,y:28,dx:0,dy:-1}];for(let i=0;i<count;i++){let z=s[i];sn.push([{x:z.x,y:z.y},{x:z.x-z.dx,y:z.y-z.dy},{x:z.x-2*z.dx,y:z.y-2*z.dy}]);dir.push({x:z.dx,y:z.dy});ndir.push({x:z.dx,y:z.dy})}foodsInit();document.getElementById('rinfo').textContent=`${round}/${series}`;tick();render();timer=setInterval(tick,N)}
function applyPower(i,t){beep(1000,.1);gain(i,20);if(t==='shield')energy[i]=100;if(t==='magnet')for(let f of foods)if(Math.abs(f.x-sn[i][0].x)+Math.abs(f.y-sn[i][0].y)<10)score[i]++;if(t==='freeze')frozenUntil=performance.now()+1800;if(t==='shrink')sn[i]=sn[i].slice(0,Math.max(3,Math.floor(sn[i].length*.55)));if(t==='mega'){score[i]+=3;sn[i].push({...sn[i][sn[i].length-1})}}
let frozenUntil=0;function tick(){if(paused||!running)return;spawnPower();for(let i=0;i<count;i++)if(alive[i]){if(types[i]==='cpu')setDir(i,ai(i));if(mode==='turbo'){if(boost[i])energy[i]=Math.max(0,energy[i]-2);else energy[i]=Math.min(100,energy[i]+.6);if(energy[i]<=0)boost[i]=false}if(i>0&&frozenUntil>performance.now()){}else dir[i]=ndir[i]}
let heads=sn.map((s,i)=>alive[i]?wrap({x:s[0].x+dir[i].x,y:s[0].y+dir[i].y}):null),deaths=Array(count).fill(false);for(let i=0;i<count;i++)if(alive[i]){let h=heads[i];if(!safe(h))deaths[i]=true;if(trail.some(p=>p.x===h.x&&p.y===h.y))deaths[i]=true;for(let j=0;j<count;j++)if(j!==i&&heads[j]&&h.x===heads[j].x&&h.y===heads[j].y)deaths[i]=true;if(mode!=='turbo'&&sn[i].slice(0,-1).some(p=>p.x===h.x&&p.y===h.y))deaths[i]=true;if(dead.some(s=>s?.some(p=>p.x===h.x&&p.y===h.y)))deaths[i]=true;if(occupiedOther(i,h.x,h.y))deaths[i]=true}
for(let i=0;i<count;i++)if(alive[i]){let old=sn[i].map(p=>({...p}));if(deaths[i]){alive[i]=false;dead.push(old);gain(i,25);beep(120,.12);continue}let h=heads[i];sn[i].unshift(h);if(mode==='turbo'&&boost[i]&&sn[i].length>3)trail.push({x:sn[i][sn[i].length-1].x,y:sn[i][sn[i].length-1].y,owner:i});let fi=foods.findIndex(f=>f.x===h.x&&f.y===h.y);if(fi>=0){score[i]++;gain(i,10);foods.splice(fi,1);while(foods.length<3){let f={x:Math.floor(Math.random()*COL),y:Math.floor(Math.random()*ROW)};if(!occupied(f.x,f.y)&&!blocked(f.x,f.y)&&!foods.some(q=>q.x===f.x&&q.y===f.y)){foods.push(f);break}}beep(720,.05)}let pi=powers.findIndex(p=>p.x===h.x&&p.y===h.y);if(pi>=0){applyPower(i,powers[pi].t);powers.splice(pi,1)}else sn[i].pop();if(mode==='collection'&&score[i]>=10){endRound();return}if(mode==='race'&&sn[i].length>=30){endRound();return}if(mode==='king'&&h.x>20&&h.x<30&&h.y>12&&h.y<23)score[i]++}
if(trail.length>800)trail.splice(0,30);if(alive.filter(Boolean).length<=1){endRound();return}render();renderScores();updateEnergy()}
function endRound(){clearInterval(timer);running=false;let w=alive.findIndex(Boolean);if(w<0)w=score.slice(0,count).indexOf(Math.max(...score.slice(0,count)));if(w>=0){score[w]++;wins[w]++;record[w]=Math.max(record[w],score[w]);gain(w,50)}save();ot.textContent=w>=0?`🏆 ${label(w)} venceu!`:'🤝 Empate!';ox.textContent=`Rodada ${round} • 3 comidas ativas • corpos permanecem no mapa`;next.textContent=round<series?'➡️ Próxima rodada':'🏅 Resultado final';ov.classList.remove('hidden');next.onclick=round<series?nextRound:final}
function nextRound(){round++;startRound()}function final(){let mx=Math.max(...score.slice(0,count)),ws=[];for(let i=0;i<count;i++)if(score[i]===mx)ws.push(label(i));ot.textContent=ws.length>1?'🤝 Empate final!':`👑 ${ws[0]} campeão!`;ox.textContent=`Placar: ${score.slice(0,count).join(' • ')} • Vitórias: ${wins.slice(0,count).join(' • ')}`;next.textContent='🔄 Nova partida';next.onclick=startMatch}
function label(i){return `Jogador ${i+1}${types[i]==='cpu'?' 🤖':''}`}function renderScores(){scores.innerHTML='';for(let i=0;i<count;i++){let d=document.createElement('div');d.className='score';d.innerHTML=`${['🟢','🩷','🔵'][i]} ${label(i)}: <b>${score[i]}</b> • Nv ${lvl[i]}`;scores.appendChild(d)}}function updateEnergy(){energy.style.width=energy[0]+'%';energyTxt.textContent=Math.round(energy[0])+'%'}function render(){x.fillStyle='#060a12';x.fillRect(0,0,c.width,c.height);x.strokeStyle='rgba(255,255,255,.035)';for(let i=0;i<=COL;i++){x.beginPath();x.moveTo(i*CELL,0);x.lineTo(i*CELL,c.height);x.stroke()}for(let i=0;i<=ROW;i++){x.beginPath();x.moveTo(0,i*CELL);x.lineTo(c.width,i*CELL);x.stroke()}for(let px=0;px<COL;px++)for(let py=0;py<ROW;py++)if(blocked(px,py)){x.fillStyle='#303e5a';x.fillRect(px*CELL,py*CELL,CELL,CELL)}trail.forEach(p=>{x.fillStyle=baseColors[p.owner];x.globalAlpha=.65;x.fillRect(p.x*CELL+5,p.y*CELL+5,CELL-10,CELL-10);x.globalAlpha=1});dead.forEach(s=>s?.forEach(p=>{x.fillStyle='#a3a8b333';x.fillRect(p.x*CELL+4,p.y*CELL+4,CELL-8,CELL-8)}));foods.forEach(f=>{x.fillStyle='#ffd24d';x.beginPath();x.arc(f.x*CELL+10,f.y*CELL+10,6,0,Math.PI*2);x.fill()});const pt=['#fff','#ff72bd','#63b3ff','#bb7cff','#ff9f43'];powers.forEach(p=>{x.fillStyle=pt[['shield','magnet','freeze','shrink','mega'].indexOf(p.t)%5];x.beginPath();x.arc(p.x*CELL+10,p.y*CELL+10,7,0,Math.PI*2);x.fill()});for(let i=0;i<count;i++)if(alive[i])sn[i].forEach((p,k)=>{x.fillStyle=baseColors[(i+skin)%baseColors.length];x.globalAlpha=k?0.82:1;x.beginPath();x.roundRect(p.x*CELL+2,p.y*CELL+2,CELL-4,CELL-4,5);x.fill();x.globalAlpha=1;if(k===0){x.fillStyle='#07110b';x.fillRect(p.x*CELL+6,p.y*CELL+5,3,3);x.fillRect(p.x*CELL+13,p.y*CELL+5,3,3)}});}
function launch(){mode=document.getElementById('mode').value;map=document.getElementById('map').value;series=+document.getElementById('series').value;skin=+document.getElementById('skin').value;menu.classList.add('hidden');game.classList.remove('hidden');startMatch()}function goBack(){clearInterval(timer);running=false;game.classList.add('hidden');menu.classList.remove('hidden');leader()}
document.getElementById('start').onclick=launch;document.getElementById('pause').onclick=()=>{paused=!paused;document.getElementById('pause').textContent=paused?'▶️':'⏸️'};document.getElementById('restart').onclick=startRound;document.getElementById('back').onclick=goBack;
</script></body></html>
