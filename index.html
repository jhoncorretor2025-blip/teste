<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>🐍 Snake Arena v1.10.1</title>
<style>
:root{--bg:#08101d;--panel:#111b2d;--line:#304463;--text:#fff;--muted:#a6b3c9;--gold:#ffd24d;--green:#67ef8a;--pink:#ff72bd;--blue:#63b3ff}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}html,body{margin:0;min-height:100%;background:radial-gradient(circle at top,#263d6b 0,#08101d 72%);color:var(--text);font:15px system-ui,-apple-system,Segoe UI,sans-serif}body{display:flex;justify-content:center;padding:10px}.app{width:min(96vw,1200px)}
h1{text-align:center;margin:0;font-size:clamp(2rem,7vw,3.7rem);letter-spacing:-.05em}.version{font-size:.28em;color:var(--muted);vertical-align:middle}.sub{text-align:center;color:var(--muted);margin:2px 0 14px}.panel,.gameWrap{background:#11182bf5;border:1px solid var(--line);border-radius:20px;box-shadow:0 18px 60px #0008;padding:14px}.grid{display:grid;grid-template-columns:1fr 1.2fr 1fr;gap:12px}.card{background:linear-gradient(#13203a,#0b1424);border:1px solid #2a3b59;border-radius:15px;padding:14px}.card h2{margin:0 0 9px;font-size:1rem}.select,.input,.btn{width:100%;min-height:44px;border-radius:12px;font:inherit;font-weight:800}.select,.input{padding:9px 11px;background:#070f1d;color:#fff;border:1px solid #354666}.btn{border:0;padding:10px;background:var(--green);color:#06100a;cursor:pointer}.btn.alt{background:#293957;color:#fff}.row{display:flex;gap:8px;flex-wrap:wrap}.row>.btn{flex:1}.players{display:grid;gap:8px}.player{padding:10px;border:1px solid #2a3b59;border-radius:12px;background:#0b1425;margin-top:8px}.check{display:flex;gap:7px;align-items:center;margin-top:7px;font-size:.8rem;color:#c5cee0}.muted{color:var(--muted);font-size:.8rem}.hidden{display:none!important}
.top{display:flex;justify-content:space-between;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:9px}.scores{display:flex;gap:7px;flex-wrap:wrap}.score{padding:8px 10px;border-radius:11px;background:#0b1220;border:1px solid #293852;font-size:.82rem}.status{display:flex;align-items:center;gap:8px;flex-wrap:wrap;background:#0b1220;border:1px solid #293652;border-radius:12px;padding:8px 10px;margin-bottom:9px}.meter{height:9px;flex:1;min-width:120px;background:#202b42;border-radius:99px;overflow:hidden}.meter i{display:block;height:100%;width:100%;background:linear-gradient(90deg,#67ef8a,#63b3ff)}.mission{padding:9px;background:#0b1425;border:1px solid #304360;border-radius:12px;margin-bottom:9px}.missionBar{height:7px;background:#202b42;border-radius:99px;overflow:hidden;margin-top:6px}.missionBar i{display:block;height:100%;width:0;background:#ffd24d}.arena{width:100%;aspect-ratio:16/10;background:#050911;border:1px solid #2b3d5d;border-radius:15px;overflow:hidden}.arena canvas{width:100%;height:100%;display:block;touch-action:none}.overlay{position:absolute;inset:0;background:#02050be8;display:grid;place-items:center;text-align:center}.arenaHost{position:relative}.overlayCard{width:min(92%,520px)}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:12px 0}.stat{background:#0b1425;border:1px solid #2b3a57;border-radius:10px;padding:9px}.stat span{display:block;color:var(--muted);font-size:.75rem}.stat b{display:block;font-size:1.1rem}.touch{display:none;position:relative;height:145px;margin-top:8px}.dpad{position:absolute;left:3px;bottom:2px;display:grid;grid-template-columns:repeat(3,50px);grid-template-rows:repeat(3,40px);gap:6px}.tbtn{border:1px solid #405575;background:#192844;color:#fff;border-radius:11px;font-weight:900}.boost{position:absolute;right:5px;bottom:5px;width:92px;height:92px;border-radius:50%;border:2px solid #ffd24d77;background:#362a0d;color:#ffd24d;font-weight:900}.boost.on{box-shadow:0 0 35px #ffd24d}.mini-refresh{font:.75rem system-ui;padding:5px 8px;border:1px solid #405575;border-radius:9px;background:#192844;color:#c5cee0;cursor:pointer;vertical-align:middle}.mini-refresh:hover{background:#2b3d5d;color:#fff}
@media(max-width:900px){.grid{grid-template-columns:1fr}.touch{display:block}.arena{aspect-ratio:4/3}}@media(max-width:600px){body{padding:6px}.arena{aspect-ratio:3/4;max-height:62vh}.dpad{grid-template-columns:repeat(3,47px);grid-template-rows:repeat(3,39px)}.boost{width:88px;height:88px}.stats{grid-template-columns:repeat(2,1fr)}}
</style>
</head><body><div class="app">
<h1>🐍 Snake Arena <span class="version">v1.10.1</span> <button id="refresh" class="mini-refresh" type="button" title="Atualizar versão">↻</button></h1><p class="sub">Até 3 jogadores • CPU • respawn • 3 comidas + ⭐ 5 pontos • celular + PC</p>
<section id="menu" class="panel"><div class="grid">
<div class="card"><h2>👥 Jogadores</h2><select id="count" class="select"><option value="1">1 jogador</option><option value="2" selected>2 jogadores</option><option value="3">3 jogadores</option></select><div id="players"></div></div>
<div class="card"><h2>🎮 Jogo</h2><select id="mode" class="select"><option value="classic">🏆 Clássico</option><option value="turbo">⚡ Turbo Worms</option></select><select id="cpuLevel" class="select" style="margin-top:7px"><option value="easy">🤖 CPU Fácil</option><option value="normal" selected>🧠 CPU Normal</option><option value="hard">🔥 CPU Difícil</option></select><div class="row" style="margin-top:8px"><button id="start" class="btn" type="button">🚀 Jogar</button><button id="sound" class="btn alt" type="button">🔊 Som</button></div></div>
<div class="card"><h2>🏷️ Personalização</h2><input id="myName" class="input" value="Jhon" maxlength="14" placeholder="Seu nome"><label class="check"><input id="showMe" type="checkbox" checked> Mostrar meu nome</label><label class="check"><input id="showOthers" type="checkbox" checked> Mostrar nomes dos outros</label><div class="muted" style="margin-top:8px">🟢 P1 • 🩷 P2 • 🔵 P3 — cores fixas por jogador.</div></div></div></section>
<section id="game" class="hidden"><div class="top"><div id="scores" class="scores"></div><div class="row"><button id="pause" class="btn alt" type="button">⏸️</button><button id="restart" class="btn" type="button">🔄</button><button id="back" class="btn alt" type="button">🏠</button></div></div>
<div class="status"><b id="badge">🏆 CLÁSSICO</b><span>⚡ P1</span><div class="meter"><i id="energy"></i></div><b id="energyText">100%</b><span>☠️ <b id="alive">0</b> vivos</span></div><div id="mission" class="mission"></div>
<div class="arenaHost"><div class="arena"><canvas id="c" width="1000" height="620"></canvas><div id="overlay" class="overlay hidden"><div class="overlayCard"><h2 id="endTitle"></h2><p id="endText"></p><div id="finalStats"></div><button id="continueBtn" class="btn" type="button">Continuar</button></div></div></div></div>
<div id="touch" class="touch"><div class="dpad"><span></span><button class="tbtn" data-dir="up" type="button">▲</button><span></span><button class="tbtn" data-dir="left" type="button">◀</button><button class="tbtn" data-dir="down" type="button">▼</button><button class="tbtn" data-dir="right" type="button">▶</button></div><button id="boostTouch" class="boost" type="button">⚡<br>TURBO</button></div>
<p class="sub">P1: setas + Espaço • P2: WASD + Shift • P3: IJKL + Enter • P = pausa</p></section></div>
<script>
'use strict';
const $=id=>document.getElementById(id), canvas=$('c'), ctx=canvas.getContext('2d');
const W=50,H=31,CELL=20,TICK=110,NORMAL_FOODS=3,PLAYER_COLORS=['#67ef8a','#ff72bd','#63b3ff'];
const DIRS={up:{x:0,y:-1},down:{x:0,y:1},left:{x:-1,y:0},right:{x:1,y:0}};
const KEYS={ArrowUp:DIRS.up,ArrowDown:DIRS.down,ArrowLeft:DIRS.left,ArrowRight:DIRS.right,KeyW:DIRS.up,KeyS:DIRS.down,KeyA:DIRS.left,KeyD:DIRS.right,KeyI:DIRS.up,KeyK:DIRS.down,KeyJ:DIRS.left,KeyL:DIRS.right};
let count=2,types=['human','cpu','cpu'],names=['Jhon','Jogador 2','Jogador 3'],show=[true,true,true],showOthers=true,controlSets=['arrows','wasd','ijkl'],mode='classic',cpuLevel='normal',sound=true;
let snakes=[],alive=[],dirs=[],nextDirs=[],foods=[],deadBodies=[],trail=[],scores=[],eaten=[],deaths=[],maxLen=[],boost=[],energy=[],respawnAt=[];
let running=false,paused=false,timer=null,audioCtx=null,mission={type:'eat',target:5,progress:0,done:false};
function safeName(s,fallback){s=String(s||'').trim().replace(/[<>]/g,'');return s.slice(0,14)||fallback}
function makePlayers(){const box=$('players');box.innerHTML='';for(let i=0;i<count;i++){const d=document.createElement('div');d.className='player';d.innerHTML='<b style="color:'+PLAYER_COLORS[i]+'">'+['🟢','🩷','🔵'][i]+' Jogador '+(i+1)+'</b><select class="select ptype" data-i="'+i+'" style="margin-top:6px"><option value="human">👤 Humano</option><option value="cpu">🤖 CPU</option></select><select class="select pcontrol" data-i="'+i+'" style="margin-top:6px"><option value="arrows">⬆️ Setas (↑↓←→)</option><option value="wasd">⌨️ W A S D</option><option value="ijkl">🎮 I J K L</option></select><input class="input pname" data-i="'+i+'" maxlength="14" value="'+safeName(names[i],'Jogador '+(i+1))+'" style="margin-top:6px"><label class="check"><input type="checkbox" class="pshow" data-i="'+i+'" '+(show[i]?'checked':'')+'> Mostrar nome</label></div>';box.appendChild(d);d.querySelector('.ptype').value=types[i]||'cpu';d.querySelector('.pcontrol').value=controlSets[i]||['arrows','wasd','ijkl'][i]}}
$('count').addEventListener('change',e=>{count=Number(e.target.value);if(count===1)types=['human','cpu','cpu'];else if(count===2)types=['human','cpu','cpu'];else types=['human','human','human'];makePlayers()});makePlayers();
$('players').addEventListener('input',e=>{if(e.target.classList.contains('pname'))names[Number(e.target.dataset.i)]=safeName(e.target.value,'Jogador '+(Number(e.target.dataset.i)+1))});
$('players').addEventListener('change',e=>{const i=Number(e.target.dataset.i);if(e.target.classList.contains('ptype'))types[i]=e.target.value;if(e.target.classList.contains('pcontrol'))controlSets[i]=e.target.value;if(e.target.classList.contains('pshow'))show[i]=e.target.checked});
$('myName').addEventListener('input',e=>names[0]=safeName(e.target.value,'Jhon'));$('showMe').addEventListener('change',e=>show[0]=e.target.checked);$('showOthers').addEventListener('change',e=>showOthers=e.target.checked);$('mode').addEventListener('change',e=>mode=e.target.value);$('cpuLevel').addEventListener('change',e=>cpuLevel=e.target.value);$('sound').addEventListener('click',e=>{sound=!sound;e.target.textContent=sound?'🔊 Som':'🔇 Som'});
function beep(freq=650){if(!sound)return;try{audioCtx??=new(window.AudioContext||window.webkitAudioContext)();if(audioCtx.state==='suspended')audioCtx.resume();const o=audioCtx.createOscillator(),g=audioCtx.createGain();o.frequency.value=freq;g.gain.value=.02;o.connect(g);g.connect(audioCtx.destination);o.start();g.gain.exponentialRampToValueAtTime(.001,audioCtx.currentTime+.07);o.stop(audioCtx.currentTime+.07)}catch(e){}}
function wall(x,y){return x<0||x>=W||y<0||y>=H}
function occupied(x,y,ignore=-1){for(let i=0;i<count;i++)if(i!==ignore&&alive[i]&&snakes[i].some(p=>p.x===x&&p.y===y))return true;for(const t of trail)if(t.x===x&&t.y===y)return true;return foods.some(f=>f.x===x&&f.y===y)}
function freeCell(){for(let z=0;z<5000;z++){const p={x:Math.floor(Math.random()*W),y:Math.floor(Math.random()*H)};if(!occupied(p.x,p.y))return p}return{x:1,y:1}}
function ensureFoods(){while(foods.filter(f=>f.kind==='normal').length<NORMAL_FOODS){const p=freeCell();foods.push({x:p.x,y:p.y,value:1,kind:'normal'})}if(!foods.some(f=>f.kind==='bonus')){const p=freeCell();foods.push({x:p.x,y:p.y,value:5,kind:'bonus'})}}
function dropFood(i){const total=eaten[i];if(!total)return;const h=snakes[i]?.[0]||{x:Math.floor(W/2),y:Math.floor(H/2)};for(let k=0;k<total;k++){let p={x:h.x+(k%5)-2,y:h.y+Math.floor(k/5)-2};if(wall(p.x,p.y)||occupied(p.x,p.y))p=freeCell();foods.push({x:p.x,y:p.y,value:1,kind:'drop',owner:i})}}
function spawn(i){const starts=[{x:6,y:7,dx:1,dy:0},{x:43,y:23,dx:-1,dy:0},{x:25,y:27,dx:0,dy:-1}],s=starts[i];let p={x:s.x,y:s.y};for(let z=0;z<300&&!wall(p.x,p.y)&&occupied(p.x,p.y);z++)p=freeCell();snakes[i]=[{x:p.x,y:p.y},{x:p.x-s.dx,y:p.y-s.dy},{x:p.x-2*s.dx,y:p.y-2*s.dy}];dirs[i]={x:s.dx,y:s.dy};nextDirs[i]={x:s.dx,y:s.dy};alive[i]=true;energy[i]=100;respawnAt[i]=0}
function reverse(a,b){return a.x===-b.x&&a.y===-b.y}
function setDir(i,d){if(!alive[i]||reverse(dirs[i],d))return;nextDirs[i]={x:d.x,y:d.y}}
function aiDir(i){const h=snakes[i][0],options=[DIRS.up,DIRS.down,DIRS.left,DIRS.right];const target=foods.slice().sort((a,b)=>(Math.abs(h.x-a.x)+Math.abs(h.y-a.y))-(Math.abs(h.x-b.x)+Math.abs(h.y-b.y)))[0];let best=dirs[i],bestScore=-1e9;for(const d of options){if(reverse(dirs[i],d))continue;const p={x:h.x+d.x,y:h.y+d.y};let sc=target?-(Math.abs(p.x-target.x)+Math.abs(p.y-target.y)):0;if(wall(p.x,p.y))sc-=1e6;if(occupied(p.x,p.y,i))sc-=7000;if(cpuLevel==='easy')sc+=Math.random()*80;if(cpuLevel==='normal')sc+=Math.random()*25;if(cpuLevel==='hard'){if(foods.some(f=>f.x===p.x&&f.y===p.y&&f.value===5))sc+=120;sc-=Math.max(0,10-Math.min(p.x,W-1-p.x,p.y,H-1-p.y))*5}if(sc>bestScore){bestScore=sc;best={x:d.x,y:d.y}}}return best}
function missionNew(){mission=Math.random()<.5?{type:'eat',target:5,progress:0,done:false}:{type:'size',target:12,progress:0,done:false}}
function updateMission(){if(mission.done)return;mission.progress=mission.type==='eat'?eaten[0]:maxLen[0];if(mission.progress>=mission.target){mission.done=true;scores[0]+=3;beep(960)}}
function renderMission(){const pct=Math.min(100,Math.round((mission.progress/mission.target)*100));$('mission').innerHTML='<b>🎯 '+(mission.type==='eat'?'Coma 5 alimentos':'Alcance tamanho 12')+'</b><span style="float:right">'+mission.progress+'/'+mission.target+(mission.done?' ✅':'')+'</span><div class="missionBar"><i style="width:'+pct+'%"></i></div>'}
function reset(){clearInterval(timer);snakes=[];alive=[];dirs=[];nextDirs=[];foods=[];deadBodies=[];trail=[];scores=Array(3).fill(0);eaten=Array(3).fill(0);deaths=Array(3).fill(0);maxLen=Array(3).fill(3);boost=Array(3).fill(false);energy=Array(3).fill(100);respawnAt=Array(3).fill(0);for(let i=0;i<count;i++){alive[i]=false;spawn(i)}ensureFoods();missionNew()}
function startGame(){names[0]=safeName($('myName').value,'Jhon');show[0]=$('showMe').checked;showOthers=$('showOthers').checked;mode=$('mode').value;cpuLevel=$('cpuLevel').value;reset();$('menu').classList.add('hidden');$('game').classList.remove('hidden');$('overlay').classList.add('hidden');$('badge').textContent=mode==='turbo'?'⚡ TURBO WORMS':'🏆 CLÁSSICO';running=true;paused=false;renderScores();renderMission();updateEnergy();draw();timer=setInterval(tick,TICK)}
function kill(i){dropFood(i);trail=trail.filter(t=>t.owner!==i);snakes[i]=[];alive[i]=false;deaths[i]++;respawnAt[i]=Date.now()+800;boost[i]=false;beep(240)}
function tick(){if(!running||paused)return;const now=Date.now();for(let i=0;i<count;i++){if(!alive[i]){if(respawnAt[i]&&now>=respawnAt[i])spawn(i);continue}if(types[i]==='cpu')nextDirs[i]=aiDir(i);dirs[i]=nextDirs[i];if(mode==='turbo'){if(boost[i]){energy[i]=Math.max(0,energy[i]-2.5);if(energy[i]===0)boost[i]=false}else energy[i]=Math.min(100,energy[i]+.7)}}const heads=snakes.map((s,i)=>alive[i]?{x:s[0].x+dirs[i].x,y:s[0].y+dirs[i].y}:null),die=Array(count).fill(false);for(let i=0;i<count;i++)if(alive[i]){const h=heads[i];if(wall(h.x,h.y))die[i]=true;for(let j=0;j<count;j++)if(j!==i&&alive[j]&&snakes[j].some(p=>p.x===h.x&&p.y===h.y))die[i]=true;if(mode!=='turbo'&&snakes[i].slice(0,-1).some(p=>p.x===h.x&&p.y===h.y))die[i]=true;if(trail.some(t=>t.x===h.x&&t.y===h.y))die[i]=true}
for(let i=0;i<count;i++)if(alive[i]){if(die[i]){kill(i);continue}const h=heads[i];snakes[i].unshift(h);const f=foods.find(q=>q.x===h.x&&q.y===h.y);if(f){scores[i]+=f.value;eaten[i]+=1;foods.splice(foods.indexOf(f),1);beep(f.value===5?1000:700)}else{if(mode==='turbo'&&boost[i]&&snakes[i].length>3){const tail=snakes[i][snakes[i].length-1];trail.push({x:tail.x,y:tail.y,owner:i})}snakes[i].pop()}maxLen[i]=Math.max(maxLen[i],snakes[i].length);if(i===0)updateMission()}
ensureFoods();renderScores();updateEnergy();renderMission();if(alive.filter(Boolean).length===0)endGame();draw()}
function endGame(){running=false;clearInterval(timer);const max=Math.max(...scores.slice(0,count)),winners=[];for(let i=0;i<count;i++)if(scores[i]===max)winners.push(label(i));$('endTitle').textContent=winners.length===1?'🏆 '+winners[0]:'🤝 Empate';$('endText').textContent='Não há minhocas vivas. As pontuações permanecem registradas nesta rodada.';let html='<div class="stats">';for(let i=0;i<count;i++)html+='<div class="stat"><span>'+['🟢','🩷','🔵'][i]+' '+esc(label(i))+'</span><b>⭐ '+scores[i]+'</b><small>☠️ '+deaths[i]+' • 📏 '+maxLen[i]+'</small></div>';html+='</div>';$('finalStats').innerHTML=html;$('overlay').classList.remove('hidden')}
function label(i){return safeName(names[i],'Jogador '+(i+1))}
function renderScores(){let h='';for(let i=0;i<count;i++)h+='<div class="score"><span style="color:'+PLAYER_COLORS[i]+'">'+['🟢','🩷','🔵'][i]+'</span> '+esc(label(i))+(types[i]==='cpu'?' 🤖':'')+' <b>'+scores[i]+'</b> • ☠️ '+deaths[i]+'</div>';$('scores').innerHTML=h;$('alive').textContent=alive.filter(Boolean).length}
function updateEnergy(){const v=Math.round(energy[0]||0);$('energy').style.width=v+'%';$('energyText').textContent=v+'%'}
function draw(){ctx.fillStyle='#050911';ctx.fillRect(0,0,canvas.width,canvas.height);ctx.strokeStyle='rgba(255,255,255,.035)';for(let x=0;x<=W;x++){ctx.beginPath();ctx.moveTo(x*CELL,0);ctx.lineTo(x*CELL,H*CELL);ctx.stroke()}for(let y=0;y<=H;y++){ctx.beginPath();ctx.moveTo(0,y*CELL);ctx.lineTo(W*CELL,y*CELL);ctx.stroke()}for(const f of foods){ctx.save();ctx.textAlign='center';ctx.textBaseline='middle';ctx.font=f.value===5?'22px sans-serif':'18px sans-serif';ctx.shadowBlur=f.value===5?20:10;ctx.shadowColor=f.value===5?'#ffd24d':f.kind==='drop'?(COLORS[f.owner]||'#fff'):'#63b3ff';ctx.fillText(f.value===5?'⭐':'🍎',f.x*CELL+10,f.y*CELL+10);ctx.restore()}for(const t of trail){ctx.fillStyle=PLAYER_COLORS[t.owner];ctx.globalAlpha=.65;ctx.fillRect(t.x*CELL+4,t.y*CELL+4,CELL-8,CELL-8);ctx.globalAlpha=1}for(let i=0;i<count;i++)if(alive[i]){const col=PLAYER_COLORS[i];for(let k=snakes[i].length-1;k>=0;k--){const p=snakes[i][k];ctx.fillStyle=col;ctx.globalAlpha=k===0?1:.78;ctx.shadowBlur=k===0?16:4;ctx.shadowColor=col;ctx.beginPath();ctx.roundRect(p.x*CELL+2,p.y*CELL+2,CELL-4,CELL-4,7);ctx.fill();ctx.globalAlpha=1}const h=snakes[i][0];ctx.fillStyle='#07110b';ctx.beginPath();ctx.arc(h.x*CELL+6,h.y*CELL+6,2,0,Math.PI*2);ctx.fill();ctx.beginPath();ctx.arc(h.x*CELL+14,h.y*CELL+6,2,0,Math.PI*2);ctx.fill();if((show[i]&&(i===0||showOthers))&&h){ctx.fillStyle='#fff';ctx.font='bold 13px system-ui';ctx.textAlign='center';ctx.textBaseline='bottom';ctx.shadowColor='#000';ctx.shadowBlur=4;ctx.fillText(label(i),h.x*CELL+10,h.y*CELL-2)}}ctx.shadowBlur=0}
function handleKey(e){if(e.code==='KeyP'&&running){paused=!paused;$('pause').textContent=paused?'▶️':'⏸️';return}if(!running||paused)return;for(let i=0;i<count;i++)if(types[i]==='human'){const sets={arrows:['ArrowUp','ArrowDown','ArrowLeft','ArrowRight'],wasd:['KeyW','KeyS','KeyA','KeyD'],ijkl:['KeyI','KeyK','KeyJ','KeyL']};const keys=sets[controlSets[i]]||sets.arrows;if(keys.includes(e.code)){e.preventDefault();setDir(i,KEYS[e.code])}if(mode==='turbo'&&((i===0&&e.code==='Space')||(i===1&&e.code.startsWith('Shift'))||(i===2&&e.code==='Enter'))){e.preventDefault();boost[i]=true}}}
function handleKeyUp(e){for(let i=0;i<count;i++)if((i===0&&e.code==='Space')||(i===1&&e.code.startsWith('Shift'))||(i===2&&e.code==='Enter'))boost[i]=false}
document.addEventListener('keydown',handleKey,{passive:false});document.addEventListener('keyup',handleKeyUp);
const dirMap={up:DIRS.up,down:DIRS.down,left:DIRS.left,right:DIRS.right};document.querySelectorAll('[data-dir]').forEach(b=>{const press=e=>{e.preventDefault();setDir(0,dirMap[b.dataset.dir])};b.addEventListener('pointerdown',press);b.addEventListener('touchstart',press,{passive:false})});const bt=$('boostTouch');bt.addEventListener('pointerdown',e=>{e.preventDefault();if(mode==='turbo'){boost[0]=true;bt.classList.add('on')}});['pointerup','pointercancel','pointerleave'].forEach(ev=>bt.addEventListener(ev,()=>{boost[0]=false;bt.classList.remove('on')}));
$('refresh').addEventListener('click',()=>location.reload());$('start').addEventListener('click',startGame);$('pause').addEventListener('click',()=>{if(running){paused=!paused;$('pause').textContent=paused?'▶️':'⏸️'}});$('restart').addEventListener('click',()=>startGame());$('back').addEventListener('click',()=>{running=false;clearInterval(timer);$('game').classList.add('hidden');$('menu').classList.remove('hidden')});$('continueBtn').addEventListener('click',()=>startGame());
