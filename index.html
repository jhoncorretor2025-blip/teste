<style>

*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}html,body{margin:0;min-height:100%;background:radial-gradient(circle at 50% -10%,#243a69,#07101d 70%);color:var(--text);font:15px system-ui,-apple-system,Segoe UI,sans-serif}body{display:flex;justify-content:center;padding:10px}.app{width:min(96vw,1220px)}h1{text-align:center;margin:0;font-size:clamp(2rem,6vw,3.8rem);text-shadow:0 0 28px #67ef8a66}.sub{text-align:center;color:var(--muted);margin:2px 0 14px}.panel,.arenaShell{background:#111a2bf2;border:1px solid var(--line);border-radius:20px;box-shadow:0 18px 60px #0008}.panel{padding:14px}.grid{display:grid;grid-template-columns:1fr 1.2fr 1fr;gap:12px}.card{background:linear-gradient(180deg,#121d34,#0b1424);border:1px solid #293a59;border-radius:15px;padding:14px}.card h2{margin:0 0 9px;font-size:1.02rem}.select,.input,.btn{width:100%;min-height:44px;border-radius:12px;font:inherit;font-weight:800}.select,.input{padding:9px 11px;background:#070f1d;color:#fff;border:1px solid #354666}.btn{padding:10px;border:0;background:var(--accent);color:#06100a;cursor:pointer}.btn.alt{background:#2a3a59;color:#fff}.btn.gold{background:var(--gold);color:#211700}.row{display:flex;gap:8px;flex-wrap:wrap}.row>.btn{flex:1;width:auto}.players{display:grid;gap:8px;margin-top:9px}.pl{padding:9px;border:1px solid #2a3b59;border-radius:12px;background:#0b1425}.two{display:grid;grid-template-columns:1fr 1fr;gap:8px}.check{display:flex;gap:7px;align-items:center;margin-top:7px;color:#c5d1e4;font-size:.82rem}.muted{color:var(--muted);font-size:.82rem}.hidden{display:none!important}.top{display:flex;justify-content:space-between;align-items:center;gap:9px;flex-wrap:wrap;margin-bottom:9px}.scores{display:flex;gap:7px;flex-wrap:wrap}.score{padding:8px 10px;border-radius:10px;background:#0b1220;border:1px solid #293855;font-size:.83rem}.status{display:flex;align-items:center;gap:8px;background:#0b1220;border:1px solid #293653;border-radius:12px;padding:8px 10px;margin-bottom:9px}.meter{height:9px;flex:1;background:#1d293f;border-radius:99px;overflow:hidden}.meter i{display:block;height:100%;width:100%;background:linear-gradient(90deg,#67ef8a,#63b3ff)}.badge{padding:5px 8px;border-radius:999px;background:#1a2948;color:#b9d9ff;font-size:.72rem;font-weight:900}.arenaShell{padding:7px;position:relative}.arena{width:100%;aspect-ratio:16/10;border-radius:15px;overflow:hidden;background:#050a12}.arena canvas{width:100%;height:100%;display:block;touch-action:none}.overlay{position:absolute;inset:7px;background:#02050bdf;display:grid;place-items:center;text-align:center;padding:20px;backdrop-filter:blur(6px)}.overlayCard{max-width:520px;width:100%}.overlay h2{font-size:clamp(2rem,7vw,3.3rem);margin:0 0 8px}.overlay p{color:#aeb9cf;white-space:pre-line}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:12px 0}.stat{background:#0b1220;border:1px solid #293957;border-radius:10px;padding:10px}.stat b{display:block;font-size:1.15rem}.mission{margin-top:9px;padding:9px;border:1px solid #334666;border-radius:12px;background:#0b1425}.missionBar{height:8px;background:#202c43;border-radius:99px;overflow:hidden;margin-top:6px}.missionBar i{display:block;height:100%;width:0;background:var(--gold);transition:width .2s}.touch{display:none;position:relative;height:150px;margin-top:8px;user-select:none}.dpad{position:absolute;left:3px;bottom:2px;display:grid;grid-template-columns:repeat(3,50px);grid-template-rows:repeat(3,40px);gap:6px}.tbtn{border:1px solid #405575;background:#192844;color:#fff;border-radius:11px;font-weight:900}.boost{position:absolute;right:5px;bottom:5px;width:92px;height:92px;border-radius:50%;border:2px solid #ffd24d77;background:#362a0d;color:#ffd24d;font-weight:900}.boost.on{box-shadow:0 0 35px #ffd24d}.notice{text-align:center;color:#aab7cd;font-size:.78rem;margin-top:8px}
@media(max-width:900px){.grid{grid-template-columns:1fr}.touch{display:block}.arena{aspect-ratio:4/3}}@media(max-width:600px){body{padding:6px}.panel{padding:10px}.two{grid-template-columns:1fr}.arena{aspect-ratio:3/4;max-height:63vh}.touch{height:140px}.dpad{grid-template-columns:repeat(3,47px);grid-template-rows:repeat(3,38px)}.boost{width:88px;height:88px}.score{flex:1;min-width:90px}.status{font-size:.78rem}}

<body>
<div class="app">
<h1>🐍 Snake Arena</h1>
<p class="sub">Até 3 jogadores • CPU inteligente • comidas especiais • turbo • missões</p>
<section id="menu" class="panel">
<div class="grid">
<div class="card"><h2>👥 Jogadores</h2><select id="count" class="select"><option value="1">1 jogador</option><option value="2" selected>2 jogadores</option><option value="3">3 jogadores</option></select><div id="players" class="players"></div></div>
<div class="card"><h2>🎮 Regras</h2><select id="mode" class="select"><option value="classic">🏆 Clássico</option><option value="turbo">⚡ Turbo Worms</option></select><select id="cpuLevel" class="select" style="margin-top:8px"><option value="easy">🤖 CPU Fácil</option><option value="normal" selected>🤖 CPU Normal</option><option value="hard">🧠 CPU Difícil</option></select><div class="row" style="margin-top:9px"><button id="start" class="btn">🚀 Jogar</button><button id="sound" class="btn alt">🔊 Som</button></div><div class="notice">Turbo: segure Espaço, Shift ou Enter para acelerar e sacrificar tamanho.</div></div>
<div class="card"><h2>🎨 Personalização</h2><input id="p1name" class="input" maxlength="14" value="Jhon" placeholder="Seu nome"><select id="skin" class="select" style="margin-top:8px"><option value="0">🟢 Neon</option><option value="1">🩷 Rosa</option><option value="2">🔵 Azul</option><option value="3">🟣 Cósmica</option><option value="4">🟠 Fogo</option></select><select id="foodStyle" class="select" style="margin-top:8px"><option value="fruit">🍎 Frutas</option><option value="gem">💎 Cristais</option><option value="star">⭐ Estrelas</option></select><div class="two" style="margin-top:8px"><select id="face" class="select"><option value="cute">😊 Fofo</option><option value="robot">🤖 Robô</option><option value="cool">😎 Radical</option></select><select id="trailStyle" class="select"><option value="glow">✨ Brilho</option><option value="dots">• Pontos</option><option value="fire">🔥 Fogo</option></select></div><label class="check"><input id="showName" type="checkbox" checked> Mostrar meu nome sobre a minhoca</label><label class="check"><input id="showOthers" type="checkbox" checked> Mostrar nomes dos outros</label><div id="leader" style="margin-top:10px"></div></div>
</div></section>
<section id="game" class="hidden">
<div class="top"><div id="scores" class="scores"></div><div class="row"><button id="pause" class="btn alt">⏸️</button><button id="restart" class="btn">🔄</button><button id="back" class="btn alt">🏠</button></div></div>
<div class="status"><span id="badge" class="badge">🏆 CLÁSSICO</span><span>⚡</span><div class="meter"><i id="energy"></i></div><b id="energyText">100%</b><span>☠️ <b id="aliveText">0</b> vivos</span></div>
<div id="mission" class="mission"></div>
<div class="arenaShell"><div class="arena"><canvas id="c" width="1000" height="620"></canvas><div id="overlay" class="overlay hidden"><div class="overlayCard"><h2 id="title"></h2><p id="msg"></p><div id="finalStats"></div><button id="next" class="btn">Continuar</button></div></div></div></div>
<div id="touch" class="touch"><div class="dpad"><span></span><button class="tbtn" data-dir="up">▲</button><span></span><button class="tbtn" data-dir="left">◀</button><button class="tbtn" data-dir="down">▼</button><button class="tbtn" data-dir="right">▶</button></div><button id="boostTouch" class="boost">⚡<br>TURBO</button></div>
<p class="notice">P1: setas + Espaço • P2: WASD + Shift • P3: IJKL + Enter • P = pausa</p>
</section>
</div>
<script>
'use strict';
const $=id=>document.getElementById(id),C=$('c'),X=C.getContext('2d');
const COLS=50,ROWS=31,CELL=20,NORMAL=105,TURBO=58,FOOD_COUNT=3;
const COLORS=['#67ef8a','#ff72bd','#63b3ff'];
const SKINS=[['#67ef8a','#3bd66d'],['#ff72bd','#d84d99'],['#63b3ff','#347ed1'],['#bb7cff','#7d45d6'],['#ff9f43','#d94f0a']];
const FOOD_ICONS={fruit:[v=>v>=10?'🍇':v>=5?'🍊':'🍎'],gem:[v=>v>=10?'💎':v>=5?'🔷':'🔹'],star:[v=>v>=10?'🌟':v>=5?'⭐':'✨']};
const K={ArrowUp:{x:0,y:-1},ArrowDown:{x:0,y:1},ArrowLeft:{x:-1,y:0},ArrowRight:{x:1,y:0},KeyW:{x:0,y:-1},KeyS:{x:0,y:1},KeyA:{x:-1,y:0},KeyD:{x:1,y:0},KeyI:{x:0,y:-1},KeyK:{x:0,y:1},KeyJ:{x:-1,y:0},KeyL:{x:1,y:0}};
let count=2,types=['human','human','cpu'],names=['Jhon','Jogador 2','Jogador 3'],showNames=[true,true,true],showOther=true,mode='classic',cpuLevel='normal',map='classic',sound=true,skin=0,foodStyle='fruit',face='cute',trailStyle='glow',snakes=[],deadBodies=[],trail=[],foods=[],dirs=[],nextDirs=[],alive=[],eaten=[0,0,0],boost=[false,false,false],energy=[100,100,100],score=[0,0,0],maxLen=[3,3,3],deaths=[0,0,0],timer=null,running=false,paused=false,audio=null,roundStart=0,statsBoost=0;
function beep(freq=440,d=.06){if(!sound)return;try{audio??=new(window.AudioContext||window.webkitAudioContext)();const o=audio.createOscillator(),g=audio.createGain();o.frequency.value=freq;o.type='square';g.gain.value=.02;o.connect(g);g.connect(audio.destination);o.start();g.gain.exponentialRampToValueAtTime(.001,audio.currentTime+d);o.stop(audio.currentTime+d)}catch(e){}}
function esc(s){return String(s||'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}
function playerLabel(i){return names[i]||`Jogador ${i+1}`}
function makePlayers(){const p=$('players');p.innerHTML='';for(let i=0;i<count;i++){const d=document.createElement('div');d.className='pl';d.innerHTML=`<b>${['🟢','🩷','🔵'][i]} Jogador ${i+1}</b><select class="select typ" data-i="${i}" style="margin-top:6px"><option value="human"${types[i]==='human'?' selected':''}>👤 Humano</option><option value="cpu"${types[i]==='cpu'?' selected':''}>🤖 CPU</option></select><input class="input pname" data-i="${i}" maxlength="14" value="${esc(names[i])}" placeholder="Nome" style="margin-top:6px"><label class="check"><input type="checkbox" class="sname" data-i="${i}"${showNames[i]?' checked':''}> Mostrar nome</label><div class="muted">${i===0?'Setas + Espaço':i===1?'W A S D + Shift':'I J K L + Enter'}</div>`;p.appendChild(d)}}
$('count').onchange=e=>{count=+e.target.value;types=count===1?['human','cpu','cpu']:count===2?['human','human','cpu']:['human','human','human'];makePlayers()};$('players').oninput=e=>{if(e.target.classList.contains('pname'))names[+e.target.dataset.i]=e.target.value.trim()||`Jogador ${+e.target.dataset.i+1}`};$('players').onchange=e=>{if(e.target.classList.contains('typ'))types[+e.target.dataset.i]=e.target.value;if(e.target.classList.contains('sname'))showNames[+e.target.dataset.i]=e.target.checked};$('p1name').oninput=e=>{names[0]=e.target.value.trim()||'Jhon'};$('showName').onchange=e=>showNames[0]=e.target.checked;$('showOthers').onchange=e=>showOther=e.target.checked;$('mode').onchange=e=>mode=e.target.value;$('cpuLevel').onchange=e=>cpuLevel=e.target.value;$('skin').onchange=e=>skin=+e.target.value;$('foodStyle').onchange=e=>foodStyle=e.target.value;$('face').onchange=e=>face=e.target.value;$('trailStyle').onchange=e=>trailStyle=e.target.value;$('sound').onclick=e=>{sound=!sound;e.target.textContent=sound?'🔊 Som':'🔇 Som'};makePlayers();
function occupied(x,y){return snakes.some(s=>s.some(p=>p.x===x&&p.y===y))||deadBodies.some(s=>s.some(p=>p.x===x&&p.y===y))||trail.some(p=>p.x===x&&p.y===y)||foods.some(f=>f.x===x&&f.y===y)}function wall(x,y){if(map==='maze')return(x===14||x===15||x===34||x===35)&&y>4&&y<27;if(map==='arena'){const dx=x-25,dy=y-15;return dx*dx+dy*dy<20}if(map==='chaos')return(x*5+y*7)%23===0;return false}function wrap(p){if(map!=='portals')return p;const q={...p};if(q.x<0)q.x=COLS-1;if(q.x>=COLS)q.x=0;if(q.y<0)q.y=ROWS-1;if(q.y>=ROWS)q.y=0;return q}function safe(p){return map==='portals'||(p.x>=0&&p.x<COLS&&p.y>=0&&p.y<ROWS&&!wall(p.x,p.y))}function freeCell(){for(let i=0;i<10000;i++){const p={x:Math.floor(Math.random()*COLS),y:Math.floor(Math.random()*ROWS)};if(!occupied(p.x,p.y)&&!wall(p.x,p.y))return p}return{x:1,y:1}}
function randomFoodValue(){const r=Math.random();return r<.12?10:r<.32?5:1}function fillFoods(){let guard=0;while(foods.length<FOOD_COUNT&&guard++<10000){const p=freeCell();foods.push({...p,value:randomFoodValue(),drop:false})}}
function addDropFoodAt(x,y,value){for(let tries=0;tries<40;tries++){const p={x:Math.max(1,Math.min(COLS-2,Math.round(x+(Math.random()*2-1)*3)),y:Math.max(1,Math.min(ROWS-2,Math.round(y+(Math.random()*2-1)*3)))};if(!wall(p.x,p.y)&&!foods.some(f=>f.x===p.x&&f.y===p.y)){foods.push({x:p.x,y:p.y,value,drop:true});return true}}return false}
function dropLoot(i,body){let remaining=eaten[i];const head=body[0];while(remaining>0){const value=remaining>=10?10:remaining>=5?5:1;if(addDropFoodAt(head.x,head.y,value))remaining-=value;else remaining--}}
function setDir(i,d){if(alive[i]&&! (dirs[i].x+d.x===0&&dirs[i].y+d.y===0))nextDirs[i]=d}function boostKey(i,c){return i===0&&c==='Space'||i===1&&(c==='ShiftLeft'||c==='ShiftRight')||i===2&&c==='Enter'}
document.addEventListener('keydown',e=>{if(e.code==='KeyP'&&running){paused=!paused;$('pause').textContent=paused?'▶️':'⏸️';return}for(let i=0;i<count;i++)if(types[i]==='human'){const ks=i===0?['ArrowUp','ArrowDown','ArrowLeft','ArrowRight']:i===1?['KeyW','KeyS','KeyA','KeyD']:['KeyI','KeyK','KeyJ','KeyL'];if(ks.includes(e.code)){e.preventDefault();setDir(i,K[e.code])}if(mode==='turbo'&&boostKey(i,e.code)){e.preventDefault();boost[i]=true}}});document.addEventListener('keyup',e=>{for(let i=0;i<count;i++)if(boostKey(i,e.code))boost[i]=false});document.querySelectorAll('[data-dir]').forEach(b=>b.onpointerdown=e=>{e.preventDefault();setDir(0,{up:K.ArrowUp,down:K.ArrowDown,left:K.ArrowLeft,right:K.ArrowRight}[b.dataset.dir])});$('boostTouch').onpointerdown=e=>{e.preventDefault();if(mode==='turbo'){boost[0]=true;$('boostTouch').classList.add('on')}};['pointerup','pointercancel','pointerleave'].forEach(v=>$('boostTouch').addEventListener(v,()=>{boost[0]=false;$('boostTouch').classList.remove('on')}));
function dist(a,b){return Math.abs(a.x-b.x)+Math.abs(a.y-b.y)}function aiDir(i){const h=snakes[i][0],opts=[dirs[i],K.ArrowUp,K.ArrowDown,K.ArrowLeft,K.ArrowRight].filter(d=>! (dirs[i].x+d.x===0&&dirs[i].y+d.y===0));const target=foods.reduce((a,b)=>!a||dist(h,b)<dist(h,a)?b:a,null);let best=dirs[i],bv=-1e9;for(const d of opts){const p=wrap({x:h.x+d.x,y:h.y+d.y});let v=target?-dist(p,target):0;if(!safe(p))v-=100000;if(snakes.some((s,j)=>j!==i&&s.some(q=>q.x===p.x&&q.y===p.y)))v-=22000;if(trail.some(t=>t.x===p.x&&t.y===p.y))v-=9000;if(cpuLevel==='easy')v+=Math.random()*30;if(cpuLevel==='normal')v+=Math.random()*10;if(cpuLevel==='hard'){for(let k=1;k<=5;k++){const q={x:p.x+d.x*k,y:p.y+d.y*k};if(!safe(q))v-=3500}}if(v>bv){bv=v;best=d}}return best}
function startRound(){clearInterval(timer);snakes=[];deadBodies=[];trail=[];foods=[];dirs=[];nextDirs=[];alive=Array(count).fill(true);eaten=[0,0,0];boost=[false,false,false];energy=[100,100,100];score=[0,0,0];maxLen=[3,3,3];deaths=[0,0,0];statsBoost=0;running=true;paused=false;roundStart=Date.now();$('overlay').classList.add('hidden');const starts=[{x:7,y:8,dx:1,dy:0},{x:42,y:22,dx:-1,dy:0},{x:25,y:27,dx:0,dy:-1}];for(let i=0;i<count;i++){const s=starts[i];snakes.push([{x:s.x,y:s.y},{x:s.x-s.dx,y:s.y-s.dy},{x:s.x-2*s.dx,y:s.y-2*s.dy}]);dirs.push({x:s.dx,y:s.dy});nextDirs.push({x:s.dx,y:s.dy})}fillFoods();$('badge').textContent=mode==='turbo'?'⚡ TURBO WORMS':'🏆 CLÁSSICO';renderScores();updateEnergy();draw();schedule()}
function schedule(){clearInterval(timer);timer=setInterval(tick,mode==='turbo'&&boost.some((b,i)=>b&&alive[i])?TURBO:NORMAL)}
function tick(){if(!running||paused)return;for(let i=0;i<count;i++)if(alive[i]){if(types[i]==='cpu')setDir(i,aiDir(i));if(mode==='turbo'){if(boost[i]){energy[i]=Math.max(0,energy[i]-1.6);if(i===0)statsBoost++;if(snakes[i].length>3){const tail=snakes[i].pop();trail.push({x:tail.x,y:tail.y,owner:i})}}else energy[i]=Math.min(100,energy[i]+.6);if(energy[i]<=0)boost[i]=false}dirs[i]=nextDirs[i]}
const heads=snakes.map((s,i)=>alive[i]?wrap({x:s[0].x+dirs[i].x,y:s[0].y+dirs[i].y}):null),death=Array(count).fill(false);for(let i=0;i<count;i++)if(alive[i]){const h=heads[i];if(!safe(h)||trail.some(t=>t.x===h.x&&t.y===h.y))death[i]=true;for(let j=0;j<count;j++)if(i!==j&&heads[j]&&h.x===heads[j].x&&h.y===heads[j].y)death[i]=true;for(let j=0;j<count;j++)if(i!==j&&snakes[j].some(p=>p.x===h.x&&p.y===h.y))death[i]=true;if(mode!=='turbo'&&snakes[i].slice(0,-1).some(p=>p.x===h.x&&p.y===h.y))death[i]=true;}
for(let i=0;i<count;i++)if(alive[i]){const old=snakes[i].map(p=>({...p}));if(death[i]){alive[i]=false;deaths[i]++;deadBodies.push(old);dropLoot(i,old);boost[i]=false;beep(120,.12);continue}const h=heads[i];snakes[i].unshift(h);const fi=foods.findIndex(f=>f.x===h.x&&f.y===h.y);if(fi>=0){const f=foods[fi];score[i]+=f.value;eaten[i]++;foods.splice(fi,1);grow(i,Math.max(1,f.value>=10?4:f.value>=5?2:1));beep(f.value>=10?1000:f.value>=5?820:700);fillFoods()}else if(!(mode==='turbo'&&boost[i]))snakes[i].pop();maxLen[i]=Math.max(maxLen[i],snakes[i].length)}
if(trail.length>1500)trail.splice(0,100);schedule();updateMission();renderScores();updateEnergy();draw();if(alive.filter(Boolean).length===0){endRound();return}}
function grow(i,n){for(let k=0;k<n;k++)snakes[i].push({...snakes[i][snakes[i].length-1]})}
let mission=null,missionDone=false;function newMission(){const a=[{t:'🍎 Coma 5 comidas',g:5,k:'food'},{t:'⚡ Use o Turbo',g:10,k:'boost'},{t:'📏 Alcance tamanho 12',g:12,k:'len'},{t:'⏱️ Sobreviva 30 segundos',g:30,k:'time'}];mission={...a[Math.floor(Math.random()*a.length)],v:0};missionDone=false;renderMission()}function renderMission(){if(!mission)return;const pct=Math.min(100,mission.v/mission.g*100);$('mission').innerHTML=`<b>🎯 Missão: ${mission.t}</b><span style="float:right">${Math.floor(mission.v)}/${mission.g}</span><div class="missionBar"><i style="width:${pct}%"></i></div>`}function updateMission(){if(!mission||missionDone)return;mission.v=mission.k==='food'?eaten[0]:mission.k==='boost'?statsBoost:mission.k==='len'?maxLen[0]:Math.floor((Date.now()-roundStart)/1000);renderMission();if(mission.v>=mission.g){missionDone=true;beep(1100,.12)}}
function startGame(){names[0]=$('p1name').value.trim()||'Jhon';showNames[0]=$('showName').checked;showOther=$('showOthers').checked;mode=$('mode').value;cpuLevel=$('cpuLevel').value;skin=+$('skin').value;foodStyle=$('foodStyle').value;face=$('face').value;trailStyle=$('trailStyle').value;$('menu').classList.add('hidden');$('game').classList.remove('hidden');newMission();startRound()}
function endRound(){clearInterval(timer);running=false;const w=score.slice(0,count).indexOf(Math.max(...score.slice(0,count)));$('title').textContent=w>=0?`🏆 ${esc(playerLabel(w))} venceu!`:'🤝 Empate';$('msg').textContent=`A rodada só termina quando todas as minhocas morrerem.\n${eaten.slice(0,count).map((v,i)=>esc(playerLabel(i))+': '+v+' comidas').join(' • ')}\nMissão: ${missionDone?'✅ concluída':'❌ não concluída'}`;$('finalStats').innerHTML='<div class="stats">'+statsCard('🍎','Maior coleta',Math.max(...eaten.slice(0,count)))+statsCard('📏','Maior tamanho',Math.max(...maxLen.slice(0,count)))+statsCard('☠️','Mortes',deaths.reduce((a,b)=>a+b,0))+'</div>';$('next').textContent='🔄 Nova rodada';$('next').onclick=startRound;$('overlay').classList.remove('hidden')}
function statsCard(a,b,c){return `<div class="stat"><span>${a}</span><b>${c}</b>${b}</div>`}
function renderScores(){$('scores').innerHTML='';for(let i=0;i<count;i++){const d=document.createElement('div');d.className='score';d.innerHTML=`${['🟢','🩷','🔵'][i]} ${esc(playerLabel(i))}${types[i]==='cpu'?' 🤖':''}: <b>${score[i]}</b> • 🍎 ${eaten[i]}`;$('scores').appendChild(d)}}function updateEnergy(){const v=Math.round(energy[0]||0);$('energy').style.width=v+'%';$('energyText').textContent=v+'%';$('aliveText').textContent=alive.filter(Boolean).length}
function draw(){X.clearRect(0,0,C.width,C.height);const g=X.createRadialGradient(C.width/2,C.height/2,40,C.width/2,C.height/2,C.width*.72);g.addColorStop(0,'#13243e');g.addColorStop(1,'#04070d');X.fillStyle=g;X.fillRect(0,0,C.width,C.height);X.strokeStyle='rgba(255,255,255,.035)';for(let i=0;i<=COLS;i++){X.beginPath();X.moveTo(i*CELL,0);X.lineTo(i*CELL,C.height);X.stroke()}for(let i=0;i<=ROWS;i++){X.beginPath();X.moveTo(0,i*CELL);X.lineTo(C.width,i*CELL);X.stroke()}if(map==='maze'){X.fillStyle='#334765';for(const xx of [14,15,34,35])X.fillRect(xx*CELL,5*CELL,CELL,22*CELL)}if(map==='arena'){X.strokeStyle='#50658e';X.lineWidth=7;X.beginPath();X.arc(C.width/2,C.height/2,Math.sqrt(480)*CELL,0,Math.PI*2);X.stroke();X.lineWidth=1}if(map==='chaos'){X.fillStyle='#23324a';for(let xx=0;xx<COLS;xx++)for(let yy=0;yy<ROWS;yy++)if(wall(xx,yy))X.fillRect(xx*CELL,yy*CELL,CELL,CELL)}
trail.forEach(t=>{X.save();X.globalAlpha=.72;X.fillStyle=COLORS[t.owner];if(trailStyle==='dots'){X.beginPath();X.arc(t.x*CELL+10,t.y*CELL+10,4,0,Math.PI*2);X.fill()}else{X.shadowBlur=trailStyle==='glow'?18:8;X.shadowColor=COLORS[t.owner];X.fillRect(t.x*CELL+4,t.y*CELL+4,CELL-8,CELL-8)}X.restore()});deadBodies.forEach(s=>s.forEach(p=>{X.globalAlpha=.35;X.fillStyle='#bfc6d4';X.fillRect(p.x*CELL+4,p.y*CELL+4,CELL-8,CELL-8);X.globalAlpha=1}));foods.forEach(f=>{X.save();X.font='14px system-ui';X.textAlign='center';X.textBaseline='middle';X.shadowBlur=16;X.shadowColor=f.value>=10?'#fff':'#ffd24d';const fn=foodStyle==='fruit'?(f.value>=10?'🍇':f.value>=5?'🍊':'🍎'):foodStyle==='gem'?(f.value>=10?'💎':f.value>=5?'🔷':'🔹'):(f.value>=10?'🌟':f.value>=5?'⭐':'✨');X.fillText(fn,f.x*CELL+10,f.y*CELL+10);if(f.drop){X.strokeStyle='rgba(255,210,77,.7)';X.beginPath();X.arc(f.x*CELL+10,f.y*CELL+10,8,0,Math.PI*2);X.stroke()}X.restore()});for(let i=0;i<count;i++)if(alive[i]){const arr=SKINS[skin];snakes[i].forEach((p,k)=>{const col=arr[k%arr.length];X.save();X.fillStyle=col;X.globalAlpha=k?0.85:1;X.shadowBlur=k===0?16:3;X.shadowColor=col;X.beginPath();X.roundRect(p.x*CELL+2,p.y*CELL+2,CELL-4,CELL-4,6);X.fill();X.restore();if(k===0){X.fillStyle='#08100b';if(face==='robot'){X.fillRect(p.x*CELL+5,p.y*CELL+5,4,4);X.fillRect(p.x*CELL+12,p.y*CELL+5,4,4)}else{X.beginPath();X.arc(p.x*CELL+6,p.y*CELL+6,2,0,Math.PI*2);X.fill();X.beginPath();X.arc(p.x*CELL+14,p.y*CELL+6,2,0,Math.PI*2);X.fill()}}});if(showNames[i]&&(i===0||showOther)){X.save();X.fillStyle='#fff';X.font='bold 13px system-ui';X.textAlign='center';X.textBaseline='bottom';X.shadowColor='#000';X.shadowBlur=5;X.fillText(playerLabel(i),snakes[i][0].x*CELL+10,snakes[i][0].y*CELL-2);X.restore()}}}
$('restart').onclick=startRound;$('pause').onclick=()=>{paused=!paused;$('pause').textContent=paused?'▶️':'⏸️'};$('back').onclick=()=>{clearInterval(timer);running=false;$('game').classList.add('hidden');$('menu').classList.remove('hidden');};$('start').onclick=startGame;
</script>
