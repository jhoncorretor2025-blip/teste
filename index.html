<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><meta name="theme-color" content="#07101d"><title>🐍 Snake Arena</title><style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}body{margin:0;background:radial-gradient(circle at top,#20365f,#07101d 70%);color:#fff;font:15px system-ui,sans-serif;display:flex;justify-content:center;padding:10px;overflow-x:hidden}.app{width:min(96vw,1200px)}h1{text-align:center;margin:0;font-size:clamp(2rem,6vw,3.7rem);text-shadow:0 0 28px #67ef8a66}.sub{text-align:center;color:#9eabc3;margin:2px 0 14px}.panel,.arenaBox{background:#11182bf2;border:1px solid #30415f;border-radius:20px;box-shadow:0 18px 60px #0008;padding:14px}.grid{display:grid;grid-template-columns:1fr 1.2fr 1fr;gap:12px}.card{background:linear-gradient(180deg,#121c32,#0b1424);border:1px solid #293a59;border-radius:15px;padding:14px}.card h2{margin:0 0 9px;font-size:1rem}.select,.input,.btn{width:100%;min-height:44px;border-radius:12px;font:inherit;font-weight:800}.select,.input{padding:9px 11px;background:#070f1d;color:#fff;border:1px solid #354666}.btn{padding:10px;border:0;background:#67ef8a;color:#06100a;cursor:pointer}.btn.alt{background:#293957;color:#fff}.row{display:flex;gap:8px;flex-wrap:wrap}.row>.btn{flex:1}.players{display:grid;gap:8px;margin-top:9px}.player{padding:10px;border:1px solid #2a3b59;border-radius:12px;background:#0b1425}.check{display:flex;gap:7px;align-items:center;margin-top:7px;font-size:.8rem}.muted{color:#9eabc3;font-size:.8rem}.hidden{display:none!important}.top{display:flex;justify-content:space-between;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:9px}.scores{display:flex;gap:7px;flex-wrap:wrap}.score{padding:8px 10px;border-radius:10px;background:#0b1220;border:1px solid #293852;font-size:.82rem}.status{display:flex;align-items:center;gap:8px;flex-wrap:wrap;background:#0b1220;border:1px solid #293652;border-radius:12px;padding:8px 10px;margin-bottom:9px}.meter{height:9px;flex:1;min-width:100px;background:#202b42;border-radius:99px;overflow:hidden}.meter i{display:block;height:100%;width:100%;background:linear-gradient(90deg,#67ef8a,#63b3ff)}.arena{position:relative;width:100%;aspect-ratio:16/10;background:#050911;border:1px solid #2b3d5d;border-radius:15px;overflow:hidden}.arena canvas{width:100%;height:100%;display:block;touch-action:none}.overlay{position:absolute;inset:0;background:#02050bdd;display:grid;place-items:center;text-align:center;z-index:5}.overlayCard{width:min(92%,520px)}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:12px 0}.stat{background:#0b1425;border:1px solid #2b3a57;border-radius:10px;padding:9px}.stat span{display:block;color:#9eabc3;font-size:.75rem}.stat b{display:block;font-size:1.1rem}.mission{padding:9px;background:#0b1425;border:1px solid #304360;border-radius:12px;margin-bottom:9px}.missionBar{height:7px;background:#202b42;border-radius:99px;overflow:hidden;margin-top:6px}.missionBar i{display:block;height:100%;width:0;background:#ffd24d}.touch{display:none;position:relative;height:145px;margin-top:8px}.dpad{position:absolute;left:3px;bottom:2px;display:grid;grid-template-columns:repeat(3,50px);grid-template-rows:repeat(3,40px);gap:6px}.tbtn{border:1px solid #405575;background:#192844;color:#fff;border-radius:11px;font-weight:900}.boost{position:absolute;right:5px;bottom:5px;width:92px;height:92px;border-radius:50%;border:2px solid #ffd24d77;background:#362a0d;color:#ffd24d;font-weight:900}.boost.on{box-shadow:0 0 35px #ffd24d}@media(max-width:900px){.grid{grid-template-columns:1fr}.touch{display:block}.arena{aspect-ratio:4/3}}@media(max-width:600px){body{padding:6px}.arena{aspect-ratio:3/4;max-height:62vh}.dpad{grid-template-columns:repeat(3,47px);grid-template-rows:repeat(3,39px)}.boost{width:88px;height:88px}.stats{grid-template-columns:repeat(2,1fr)}}
</style></head><body><div class="app"><h1>🐍 Snake Arena</h1><p class="sub">Até 3 jogadores • CPU • respawn • 3 comidas + 1 comida ⭐ de 5 pontos</p>
<section id="menu" class="panel"><div class="grid"><div class="card"><h2>👥 Jogadores</h2><select id="count" class="select"><option value="1">1 jogador</option><option value="2" selected>2 jogadores</option><option value="3">3 jogadores</option></select><div id="players" class="players"></div></div>
<div class="card"><h2>🎮 Jogo</h2><select id="mode" class="select"><option value="classic">🏆 Clássico</option><option value="turbo">⚡ Turbo Worms</option></select><select id="cpu" class="select" style="margin-top:7px"><option value="easy">🤖 CPU Fácil</option><option value="normal" selected>🧠 CPU Normal</option><option value="hard">🔥 CPU Difícil</option></select><div class="row" style="margin-top:8px"><button id="start" class="btn" type="button">🚀 Jogar</button><button id="sound" class="btn alt" type="button">🔊 Som</button></div></div>
<div class="card"><h2>🏷️ Personalização</h2><input id="myName" class="input" maxlength="14" value="Jhon" placeholder="Seu nome"><label class="check"><input id="showMe" type="checkbox" checked> Mostrar meu nome</label><label class="check"><input id="showOthers" type="checkbox" checked> Mostrar nomes dos outros</label><select id="skin" class="select" style="margin-top:7px"><option value="0">🟢 Neon</option><option value="1">🩷 Rosa</option><option value="2">🔵 Azul</option><option value="3">🟣 Cósmica</option><option value="4">🟠 Fogo</option></select><div class="muted" style="margin-top:8px">Quando morrer, você volta automaticamente com 3 segmentos.</div></div></div></section>
<section id="game" class="hidden"><div class="top"><div id="scores" class="scores"></div><div class="row"><button id="pause" class="btn alt">⏸️</button><button id="restart" class="btn">🔄</button><button id="back" class="btn alt">🏠</button></div></div><div class="status"><b id="badge">🏆 CLÁSSICO</b><span>⚡</span><div class="meter"><i id="energy"></i></div><b id="energyText">100%</b><span>☠️ <b id="alive">0</b> vivos</span></div><div id="mission" class="mission"></div><div class="arenaBox"><div class="arena"><canvas id="c" width="1000" height="620"></canvas><div id="overlay" class="overlay hidden"><div class="overlayCard"><h2 id="endTitle">Fim</h2><p id="endText"></p><div id="finalStats"></div><button id="continueBtn" class="btn">Continuar</button></div></div></div></div><div id="touch" class="touch"><div class="dpad"><span></span><button class="tbtn" data-dir="up">▲</button><span></span><button class="tbtn" data-dir="left">◀</button><button class="tbtn" data-dir="down">▼</button><button class="tbtn" data-dir="right">▶</button></div><button id="boostTouch" class="boost">⚡<br>TURBO</button></div><p class="sub" style="font-size:.75rem">P1 setas + Espaço • P2 WASD + Shift • P3 IJKL + Enter</p></section></div>
<script>
'use strict';const $=id=>document.getElementById(id),C=$('c'),ctx=C.getContext('2d');const W=50,H=31,S=20,STEP=105,BOOST=58,FOOD_NORMAL=3;const COLORS=['#67ef8a','#ff72bd','#63b3ff'],PLAYER_PALETTES=[['#67ef8a','#31d76c','#0fa74d'],['#ff72bd','#db4e9b','#9a2f6d'],['#63b3ff','#3686df','#245ba8']],SKINS=[['#67ef8a','#31d76c','#0fa74d'],['#ff72bd','#db4e9b','#9a2f6d'],['#63b3ff','#3686df','#245ba8'],['#bd83ff','#8549d2','#552b94'],['#ffb15b','#ff7e27','#bd4500']];const KEY={ArrowUp:[0,-1],ArrowDown:[0,1],ArrowLeft:[-1,0],ArrowRight:[1,0],KeyW:[0,-1],KeyS:[0,1],KeyA:[-1,0],KeyD:[1,0],KeyI:[0,-1],KeyK:[0,1],KeyJ:[-1,0],KeyL:[1,0]};
let count=2,types=['human','human','cpu'],names=['Jhon','Jogador 2','Jogador 3'],show=[true,true,true],showOthers=true,mode='classic',cpu='normal',skin=0,sound=true,snakes=[],alive=[],dirs=[],nextDirs=[],eaten=[0,0,0],score=[0,0,0],deaths=[0,0,0],maxLen=[3,3,3],foods=[],deadBodies=[],boost=[false,false,false],energy=[100,100,100],respawnAt=[0,0,0],mission={type:'eat',target:5,done:false},missionText='',timer=null,running=false,paused=false,audio=null,lastTime=0;
function beep(f=600){if(!sound)return;try{audio??=new(window.AudioContext||window.webkitAudioContext)();let o=audio.createOscillator(),g=audio.createGain();o.frequency.value=f;g.gain.value=.018;o.connect(g);g.connect(audio.destination);o.start();g.gain.exponentialRampToValueAtTime(.001,audio.currentTime+.06);o.stop(audio.currentTime+.06)}catch(e){}}
function esc(v){return String(v||'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}function label(i){return names[i]||`Jogador ${i+1}`}
function makePlayers(){let p=$('players');p.innerHTML='';for(let i=0;i<count;i++){let d=document.createElement('div');d.className='player';d.innerHTML=`<b>${['🟢','🩷','🔵'][i]} Jogador ${i+1}</b><select class="select typ" data-i="${i}" style="margin-top:6px"><option value="human"${types[i]==='human'?' selected':''}>👤 Humano</option><option value="cpu"${types[i]==='cpu'?' selected':''}>🤖 CPU</option></select><input class="input pname" data-i="${i}" maxlength="14" value="${esc(names[i])}" placeholder="Nome" style="margin-top:6px"><label class="check"><input type="checkbox" class="showname" data-i="${i}"${show[i]?' checked':''}> Mostrar nome</label></div>`;p.appendChild(d)}}
$('count').onchange=e=>{count=+e.target.value;types=count===1?['human','cpu','cpu']:count===2?['human','human','cpu']:['human','human','human'];makePlayers()};makePlayers();$('players').oninput=e=>{if(e.target.classList.contains('pname'))names[+e.target.dataset.i]=e.target.value.trim()||`Jogador ${+e.target.dataset.i+1}`};$('players').onchange=e=>{if(e.target.classList.contains('typ'))types[+e.target.dataset.i]=e.target.value;if(e.target.classList.contains('showname'))show[+e.target.dataset.i]=e.target.checked};$('myName').oninput=e=>names[0]=e.target.value.trim()||'Jhon';$('showMe').onchange=e=>show[0]=e.target.checked;$('showOthers').onchange=e=>showOthers=e.target.checked;$('mode').onchange=e=>mode=e.target.value;$('cpu').onchange=e=>cpu=e.target.value;$('skin').onchange=e=>skin=+e.target.value;$('sound').onclick=e=>{sound=!sound;e.target.textContent=sound?'🔊 Som':'🔇 Som'};
function occupied(x,y){return snakes.some((s,i)=>alive[i]&&s.some(p=>p.x===x&&p.y===y))||deadBodies.some(s=>s.some(p=>p.x===x&&p.y===y))||foods.some(f=>f.x===x&&f.y===y)}function wall(x,y){return x<0||x>=W||y<0||y>=H}function free(){for(let z=0;z<4000;z++){let p={x:Math.floor(Math.random()*W),y:Math.floor(Math.random()*H)};if(!occupied(p.x,p.y))return p}return{x:1,y:1}}
function addNormalFoods(){while(foods.filter(f=>f.kind==='normal').length<FOOD_NORMAL){let p=free();foods.push({x:p.x,y:p.y,value:1,kind:'normal'})}if(!foods.some(f=>f.kind==='bonus')){let p=free();foods.push({x:p.x,y:p.y,value:5,kind:'bonus'})}}
function dropDeathFood(i){let n=eaten[i];let h=snakes[i]?.[0]||{x:W/2,y:H/2};for(let k=0;k<n;k++){let p={x:h.x+(k%5)-2,y:h.y+Math.floor(k/5)-Math.floor(n/5/2)};if(wall(p.x,p.y)||occupied(p.x,p.y))p=free();foods.push({x:p.x,y:p.y,value:1,kind:'drop',owner:i})}}
function setDir(i,d){if(alive[i]&&!dirs[i].every((v,k)=>v+d[k]===0))nextDirs[i]={x:d[0],y:d[1]}}
function boostKey(i,c){return i===0&&c==='Space'||i===1&&(c==='ShiftLeft'||c==='ShiftRight')||i===2&&c==='Enter'}
document.addEventListener('keydown',e=>{if(e.code==='KeyP'&&running){paused=!paused;$('pause').textContent=paused?'▶️':'⏸️';return}if(!running)return;for(let i=0;i<count;i++)if(types[i]==='human'){let keys=i===0?['ArrowUp','ArrowDown','ArrowLeft','ArrowRight']:i===1?['KeyW','KeyS','KeyA','KeyD']:['KeyI','KeyK','KeyJ','KeyL'];if(keys.includes(e.code)){e.preventDefault();setDir(i,KEY[e.code])}if(mode==='turbo'&&boostKey(i,e.code)){boost[i]=true}}});document.addEventListener('keyup',e=>{for(let i=0;i<count;i++)if(boostKey(i,e.code))boost[i]=false});document.querySelectorAll('[data-dir]').forEach(b=>b.addEventListener('pointerdown',e=>{e.preventDefault();setDir(0,KEY[{up:'ArrowUp',down:'ArrowDown',left:'ArrowLeft',right:'ArrowRight'}[b.dataset.dir]])}));$('boostTouch').addEventListener('pointerdown',e=>{e.preventDefault();if(mode==='turbo'){boost[0]=true;$('boostTouch').classList.add('on')}});['pointerup','pointercancel','pointerleave'].forEach(ev=>$('boostTouch').addEventListener(ev,()=>{boost[0]=false;$('boostTouch').classList.remove('on')}));
function ai(i){let h=snakes[i][0],opts=[[1,0],[-1,0],[0,1],[0,-1]],best=dirs[i],val=-1e9;let f=foods.filter(q=>q.kind!=='drop'||q.owner!==i).sort((a,b)=>Math.abs(h.x-a.x)+Math.abs(h.y-a.y)-Math.abs(h.x-b.x)-Math.abs(h.y-b.y))[0];for(let d of opts){let p={x:h.x+d[0],y:h.y+d[1]},v=f?-(Math.abs(p.x-f.x)+Math.abs(p.y-f.y)):0;if(wall(p.x,p.y))v-=1e6;if(occupiedOther(i,p.x,p.y))v-=5e4;if(cpu==='easy')v+=Math.random()*40;if(cpu==='hard'&&foods.some(q=>q.x===p.x&&q.y===p.y&&q.value===5))v+=100; if(v>val){val=v;best={x:d[0],y:d[1]}}}return best}
function occupiedOther(i,x,y){for(let j=0;j<count;j++)if(j!==i&&alive[j]&&snakes[j].some(p=>p.x===x&&p.y===y))return true;return false}
function chooseMission(){let r=Math.random();mission=r<.5?{type:'eat',target:5,progress:0,done:false}:{type:'size',target:12,progress:0,done:false};missionText=mission.type==='eat'?'🍎 Coma 5 alimentos':'📏 Alcance tamanho 12'}function updateMission(){if(mission.done)return;mission.progress=mission.type==='eat'?eaten[0]:maxLen[0];if(mission.progress>=mission.target){mission.done=true;score[0]+=3;beep(950)}}function renderMission(){let p=Math.min(100,Math.round((mission.progress/mission.target)*100));$('mission').innerHTML=`<b>🎯 ${missionText}</b><span style="float:right">${mission.progress}/${mission.target}${mission.done?' ✅':''}</span><div class="missionBar"><i style="width:${p}%"></i></div>`}
function spawn(i){let starts=[{x:7,y:8,dx:1,dy:0},{x:42,y:22,dx:-1,dy:0},{x:25,y:27,dx:0,dy:-1}],s=starts[i];let p={x:s.x,y:s.y},tries=0;while((occupied(p.x,p.y)||wall(p.x,p.y))&&tries++<500){p=free()}snakes[i]=[{x:p.x,y:p.y},{x:p.x-s.dx,y:p.y-s.dy},{x:p.x-2*s.dx,y:p.y-2*s.dy}];dirs[i]={x:s.dx,y:s.dy};nextDirs[i]={x:s.dx,y:s.dy};alive[i]=true;energy[i]=100;respawnAt[i]=0;beep(760)}
function startGame(){names[0]=$('myName').value.trim()||'Jhon';show[0]=$('showMe').checked;showOthers=$('showOthers').checked;mode=$('mode').value;cpu=$('cpu').value;skin=+$('skin').value;clearInterval(timer);snakes=[];deadBodies=[];trail=[];foods=[];alive=[];dirs=[];nextDirs=[];eaten=[0,0,0];score=[0,0,0];deaths=[0,0,0];maxLen=[3,3,3];boost=[false,false,false];energy=[100,100,100];respawnAt=[0,0,0];for(let i=0;i<count;i++){alive[i]=false;spawn(i)}addNormalFoods();chooseMission();$('menu').classList.add('hidden');$('game').classList.remove('hidden');$('overlay').classList.add('hidden');$('badge').textContent=mode==='turbo'?'⚡ TURBO WORMS':'🏆 CLÁSSICO';running=true;paused=false;renderScores();renderMission();updateEnergy();draw();timer=setInterval(tick,STEP)}
function tick(){if(!running||paused)return;let now=Date.now();for(let i=0;i<count;i++){if(!alive[i]){if(respawnAt[i]&&now>=respawnAt[i])spawn(i);continue}if(types[i]==='cpu')nextDirs[i]=ai(i);dirs[i]=nextDirs[i];if(mode==='turbo'){if(boost[i]){energy[i]=Math.max(0,energy[i]-2);if(energy[i]===0)boost[i]=false}else energy[i]=Math.min(100,energy[i]+.6)}}let heads=snakes.map((s,i)=>alive[i]?{x:s[0].x+dirs[i].x,y:s[0].y+dirs[i].y}:null),die=Array(count).fill(false);for(let i=0;i<count;i++)if(alive[i]){let h=heads[i];if(wall(h.x,h.y))die[i]=true;for(let j=0;j<count;j++)if(i!==j&&alive[j]&&snakes[j].some(p=>p.x===h.x&&p.y===h.y))die[i]=true;if(mode!=='turbo'&&snakes[i].slice(0,-1).some(p=>p.x===h.x&&p.y===h.y))die[i]=true;if(deadBodies.some(s=>s.some(p=>p.x===h.x&&p.y===h.y)))die[i]=true;if(trail.some(t=>t.x===h.x&&t.y===h.y))die[i]=true}
for(let i=0;i<count;i++)if(alive[i]){if(die[i]){deadBodies.push(snakes[i].map(p=>({...p})));dropDeathFood(i);alive[i]=false;deaths[i]++;respawnAt[i]=Date.now()+900;boost[i]=false;continue}let h=heads[i];snakes[i].unshift(h);let food=foods.find(f=>f.x===h.x&&f.y===h.y);if(food){score[i]+=food.value;eaten[i]+=food.value;foods.splice(foods.indexOf(food),1);addNormalFoods();beep(food.value===5?1000:700)}else{if(mode==='turbo'&&boost[i]&&snakes[i].length>3){trail.push({x:snakes[i][snakes[i].length-1].x,y:snakes[i][snakes[i].length-1].y,owner:i})}snakes[i].pop()}maxLen[i]=Math.max(maxLen[i],snakes[i].length);if(i===0)updateMission()}
addNormalFoods();renderScores();updateEnergy();renderMission();draw()}
function renderScores(){let html='';for(let i=0;i<count;i++)html+=`<div class="score">${['🟢','🩷','🔵'][i]} ${esc(label(i))}${types[i]==='cpu'?' 🤖':''}: <b>${score[i]}</b> • ☠️ ${deaths[i]}</div>`;$('scores').innerHTML=html;$('alive').textContent=alive.filter(Boolean).length}
function updateEnergy(){let v=Math.round(energy[0]||0);$('energy').style.width=v+'%';$('energyText').textContent=v+'%'}
function draw(){let g=ctx.createRadialGradient(C.width/2,C.height/2,30,C.width/2,C.height/2,C.width*.72);g.addColorStop(0,'#142640');g.addColorStop(1,'#03070d');ctx.fillStyle=g;ctx.fillRect(0,0,C.width,C.height);ctx.strokeStyle='rgba(255,255,255,.035)';for(let x=0;x<=W;x++){ctx.beginPath();ctx.moveTo(x*S,0);ctx.lineTo(x*S,C.height);ctx.stroke()}for(let y=0;y<=H;y++){ctx.beginPath();ctx.moveTo(0,y*S);ctx.lineTo(C.width,y*S);ctx.stroke()}
foods.forEach(f=>{ctx.save();ctx.textAlign='center';ctx.textBaseline='middle';ctx.shadowBlur=f.value===5?22:14;ctx.shadowColor=f.value===5?'#ffd24d':f.kind==='drop'?(COLORS[f.owner]||'#fff'):'#63b3ff';ctx.font=f.value===5?'22px sans-serif':'18px sans-serif';ctx.fillText(f.value===5?'⭐':mode==='turbo'?'🍎':'●',f.x*S+10,f.y*S+10);ctx.restore()});trail.forEach(t=>{ctx.save();ctx.fillStyle=COLORS[t.owner];ctx.globalAlpha=.7;ctx.shadowBlur=10;ctx.shadowColor=COLORS[t.owner];ctx.fillRect(t.x*S+4,t.y*S+4,S-8,S-8);ctx.restore()});deadBodies.forEach((s,idx)=>s.forEach(p=>{ctx.save();ctx.globalAlpha=.38;ctx.fillStyle='#c7cedb';ctx.fillRect(p.x*S+4,p.y*S+4,S-8,S-8);ctx.restore()}));for(let i=0;i<count;i++)if(alive[i]){let pal=PLAYER_PALETTES[i];snakes[i].forEach((p,k)=>{ctx.save();let col=pal[(i+k)%pal.length];ctx.fillStyle=col;ctx.globalAlpha=k?.82:1;ctx.shadowBlur=k===0?15:3;ctx.shadowColor=col;ctx.beginPath();ctx.roundRect(p.x*S+2,p.y*S+2,S-4,S-4,7);ctx.fill();ctx.restore();if(k===0){ctx.fillStyle='#07110b';ctx.beginPath();ctx.arc(p.x*S+6,p.y*S+6,2,0,Math.PI*2);ctx.fill();ctx.beginPath();ctx.arc(p.x*S+14,p.y*S+6,2,0,Math.PI*2);ctx.fill()}});if(show[i]&&(i===0||showOthers)){ctx.save();ctx.fillStyle='#fff';ctx.font='bold 13px system-ui';ctx.textAlign='center';ctx.textBaseline='bottom';ctx.shadowColor='#000';ctx.shadowBlur=4;ctx.fillText(label(i),snakes[i][0].x*S+10,snakes[i][0].y*S-2);ctx.restore()}}}
function restart(){startGame()}$('start').onclick=startGame;$('pause').onclick=()=>{paused=!paused;$('pause').textContent=paused?'▶️':'⏸️'};$('restart').onclick=restart;$('back').onclick=()=>{running=false;clearInterval(timer);$('game').classList.add('hidden');$('menu').classList.remove('hidden')};
</script><!-- FIXED_PLAYER_COLORS --></body></html>
