<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Snake — Jogo da Cobrinha</title>
  <style>
    * { box-sizing: border-box; }
    :root {
      --bg: #0b1020;
      --panel: #11182b;
      --border: #263352;
      --text: #f4f7ff;
      --muted: #9aa7c2;
      --accent: #62e58a;
      --danger: #ff5c72;
      --food: #ffcc4d;
    }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 20px;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      color: var(--text);
      background: radial-gradient(circle at top, #182544 0%, var(--bg) 55%);
    }
    .game {
      width: min(94vw, 560px);
      text-align: center;
    }
    h1 { margin: 0 0 6px; font-size: clamp(2rem, 7vw, 3rem); }
    .subtitle { margin: 0 0 18px; color: var(--muted); }
    .hud {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 12px;
      padding: 12px 16px;
      border: 1px solid var(--border);
      border-radius: 14px;
      background: rgba(17, 24, 43, .9);
    }
    .score { font-size: 1.15rem; font-weight: 700; }
    .score span { color: var(--accent); }
    button {
      border: 0;
      border-radius: 10px;
      padding: 10px 16px;
      font: inherit;
      font-weight: 700;
      cursor: pointer;
      color: #07110b;
      background: var(--accent);
    }
    button:hover { filter: brightness(1.08); }
    .board-wrap {
      position: relative;
      width: 100%;
      aspect-ratio: 1;
      padding: 8px;
      border: 1px solid var(--border);
      border-radius: 18px;
      background: var(--panel);
      box-shadow: 0 18px 50px rgba(0,0,0,.35);
    }
    canvas {
      display: block;
      width: 100%;
      height: 100%;
      border-radius: 11px;
      background: #080d19;
      touch-action: none;
    }
    .overlay {
      position: absolute;
      inset: 8px;
      display: grid;
      place-items: center;
      padding: 24px;
      border-radius: 11px;
      background: rgba(5, 8, 16, .78);
      backdrop-filter: blur(3px);
    }
    .overlay.hidden { display: none; }
    .message h2 { margin: 0 0 8px; font-size: 2rem; }
    .message p { margin: 0 0 18px; color: var(--muted); }
    .help { margin-top: 16px; color: var(--muted); font-size: .92rem; }
    kbd {
      padding: 3px 7px;
      border: 1px solid var(--border);
      border-radius: 6px;
      background: var(--panel);
      color: var(--text);
    }
    .controls {
      display: grid;
      grid-template-columns: repeat(3, 58px);
      justify-content: center;
      gap: 7px;
      margin-top: 16px;
    }
    .controls button { padding: 0; width: 58px; height: 48px; font-size: 1.25rem; }
    .controls .empty { visibility: hidden; }
    @media (min-width: 700px) { .controls { display: none; } }
  </style>
</head>
<body>
  <main class="game">
    <h1>🐍 Snake</h1>
    <p class="subtitle">Coma a comida, cresça e não bata!</p>

    <section class="hud">
      <div class="score">Pontuação: <span id="score">0</span></div>
      <button id="restartTop" type="button">Reiniciar</button>
    </section>

    <div class="board-wrap">
      <canvas id="gameCanvas" width="500" height="500" aria-label="Tabuleiro do jogo Snake"></canvas>
      <div id="overlay" class="overlay hidden">
        <div class="message">
          <h2>💥 Game Over!</h2>
          <p>Sua pontuação: <strong id="finalScore">0</strong></p>
          <button id="restart" type="button">Jogar novamente</button>
        </div>
      </div>
    </div>

    <div class="controls" aria-label="Controles para celular">
      <button class="empty" aria-hidden="true">•</button>
      <button data-dir="up" aria-label="Cima">▲</button>
      <button class="empty" aria-hidden="true">•</button>
      <button data-dir="left" aria-label="Esquerda">◀</button>
      <button data-dir="down" aria-label="Baixo">▼</button>
      <button data-dir="right" aria-label="Direita">▶</button>
    </div>

    <p class="help">Use as <kbd>setas</kbd> do teclado para controlar a cobra.</p>
  </main>

  <script>
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');
    const scoreEl = document.getElementById('score');
    const finalScoreEl = document.getElementById('finalScore');
    const overlay = document.getElementById('overlay');
    const restart = document.getElementById('restart');
    const restartTop = document.getElementById('restartTop');

    const GRID = 25;
    const CELL = canvas.width / GRID;
    const SPEED = 105;

    let snake;
    let food;
    let direction;
    let nextDirection;
    let score;
    let gameOver;
    let timer;

    function startGame() {
      clearInterval(timer);
      snake = [
        { x: 12, y: 12 },
        { x: 11, y: 12 },
        { x: 10, y: 12 }
      ];
      direction = { x: 1, y: 0 };
      nextDirection = { x: 1, y: 0 };
      score = 0;
      gameOver = false;
      scoreEl.textContent = score;
      overlay.classList.add('hidden');
      placeFood();
      draw();
      timer = setInterval(update, SPEED);
    }

    function placeFood() {
      do {
        food = {
          x: Math.floor(Math.random() * GRID),
          y: Math.floor(Math.random() * GRID)
        };
      } while (snake.some(part => part.x === food.x && part.y === food.y));
    }

    function setDirection(newDirection) {
      // Impede a cobra de virar diretamente para trás.
      if (newDirection.x + direction.x === 0 && newDirection.y + direction.y === 0) return;
      nextDirection = newDirection;
    }

    function update() {
      direction = nextDirection;
      const head = {
        x: snake[0].x + direction.x,
        y: snake[0].y + direction.y
      };

      // Colisão com as paredes.
      if (head.x < 0 || head.x >= GRID || head.y < 0 || head.y >= GRID) {
        endGame();
        return;
      }

      const eating = head.x === food.x && head.y === food.y;

      // Se não estiver comendo, a cauda sai antes da checagem para permitir
      // que a cabeça ocupe a antiga posição da cauda.
      const bodyToCheck = eating ? snake : snake.slice(0, -1);
      if (bodyToCheck.some(part => part.x === head.x && part.y === head.y)) {
        endGame();
        return;
      }

      snake.unshift(head);

      if (eating) {
        score++;
        scoreEl.textContent = score;
        placeFood();
      } else {
        snake.pop();
      }

      draw();
    }

    function endGame() {
      gameOver = true;
      clearInterval(timer);
      finalScoreEl.textContent = score;
      overlay.classList.remove('hidden');
      draw();
    }

    function draw() {
      // Fundo e grade.
      ctx.fillStyle = '#080d19';
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      ctx.strokeStyle = 'rgba(255,255,255,.035)';
      ctx.lineWidth = 1;
      for (let i = 1; i < GRID; i++) {
        const p = i * CELL;
        ctx.beginPath(); ctx.moveTo(p, 0); ctx.lineTo(p, canvas.height); ctx.stroke();
        ctx.beginPath(); ctx.moveTo(0, p); ctx.lineTo(canvas.width, p); ctx.stroke();
      }

      // Comida.
      ctx.fillStyle = '#ffcc4d';
      ctx.beginPath();
      ctx.arc(food.x * CELL + CELL / 2, food.y * CELL + CELL / 2, CELL * .32, 0, Math.PI * 2);
      ctx.fill();

      // Cobra.
      snake.forEach((part, index) => {
        const padding = index === 0 ? 2 : 3;
        const x = part.x * CELL + padding;
        const y = part.y * CELL + padding;
        const size = CELL - padding * 2;
        ctx.fillStyle = index === 0 ? '#8cffaa' : '#42c96c';
        roundRect(ctx, x, y, size, size, 5);
        ctx.fill();
      });

      // Olhos na cabeça.
      const head = snake[0];
      const cx = head.x * CELL + CELL / 2;
      const cy = head.y * CELL + CELL / 2;
      const eyeOffset = 5;
      ctx.fillStyle = '#07110b';
      for (const side of [-1, 1]) {
        let ex = cx, ey = cy;
        if (direction.x !== 0) { ex += direction.x * eyeOffset; ey += side * 5; }
        else { ex += side * 5; ey += direction.y * eyeOffset; }
        ctx.beginPath(); ctx.arc(ex, ey, 2, 0, Math.PI * 2); ctx.fill();
      }
    }

    function roundRect(context, x, y, width, height, radius) {
      context.beginPath();
      context.roundRect(x, y, width, height, radius);
    }

    document.addEventListener('keydown', event => {
      const keys = {
        ArrowUp: { x: 0, y: -1 },
        ArrowDown: { x: 0, y: 1 },
        ArrowLeft: { x: -1, y: 0 },
        ArrowRight: { x: 1, y: 0 }
      };
      if (keys[event.key]) {
        event.preventDefault();
        setDirection(keys[event.key]);
      }
      if (event.key === 'Enter' && gameOver) startGame();
    });

    document.querySelectorAll('[data-dir]').forEach(button => {
      button.addEventListener('click', () => {
        const dirs = {
          up: { x: 0, y: -1 },
          down: { x: 0, y: 1 },
          left: { x: -1, y: 0 },
          right: { x: 1, y: 0 }
        };
        setDirection(dirs[button.dataset.dir]);
      });
    });

    restart.addEventListener('click', startGame);
    restartTop.addEventListener('click', startGame);

    startGame();
  </script>
</body>
</html>
