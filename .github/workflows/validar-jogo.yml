name: Validar jogo
on:
  push:
    branches:
      - "fix/**"
  pull_request:
    branches:
      - main
permissions:
  contents: read
jobs:
  testes:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Baixar o repositório
        uses: actions/checkout@v4
      - name: Preparar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Instalar dependências dos testes
        run: npm install --no-audit --no-fund
      - name: Verificar o projeto e rodar todos os testes
        run: npm test
