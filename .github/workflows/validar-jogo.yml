name: Validar jogo
on:
  push:
    branches:
      - "fix/**"
  pull_request:
    branches:
      - main
permissions:
  contents: write
jobs:
  testes:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Baixar o repositório
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref }}
      - name: Preparar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Instalar dependências dos testes
        run: npm install --no-audit --no-fund
      - name: Regenerar mapa do código
        run: python3 tools/gerar-mapa.py
      - name: Registrar mapa gerado no branch da correção
        if: github.event_name == 'push'
        env:
          GITHUB_REF_NAME: ${{ github.ref_name }}
        run: |
          if ! git diff --quiet -- docs/MAPA-DO-CODIGO.md; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add docs/MAPA-DO-CODIGO.md
            git commit -m "Atualiza mapa do código"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi
      - name: Verificar o projeto e rodar todos os testes
        run: npm test
