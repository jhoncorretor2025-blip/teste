name: Temporary validation
on:
  push:
    branches: [fix/sala-por-link-sem-pin]
  pull_request:
    branches: [main]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm install
      - run: node tests/debug-online-link.mjs
