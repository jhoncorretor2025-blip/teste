name: Deploy site para GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Baixar arquivos do repositório
        uses: actions/checkout@v6

      - name: Corrigir controles e aplicar versão v1.9.1
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          if "let trail=[];" not in s:
              s = s.replace("let count=2,types=['human','human','cpu'],", "let trail=[];let count=2,types=['human','human','cpu'],", 1)
          s = re.sub(r'<h1>🐍 Snake Arena(?:\s*<span[^>]*>v[0-9.]+</span>)?</h1>', '<h1>🐍 Snake Arena <span style="font-size:.28em;color:#9eabc3;vertical-align:middle">v1.9.1</span></h1>', s, count=1)
          patch = r'''
          <script>
          (()=>{
            const keyDirs={ArrowUp:[0,-1],ArrowDown:[0,1],ArrowLeft:[-1,0],ArrowRight:[1,0],KeyW:[0,-1],KeyS:[0,1],KeyA:[-1,0],KeyD:[1,0],KeyI:[0,-1],KeyK:[0,1],KeyJ:[-1,0],KeyL:[1,0]};
            window.addEventListener('keydown',e=>{
              if(!window.running||window.paused) return;
              if(keyDirs[e.code]){
                e.preventDefault();
                let i=0;
                if(['KeyW','KeyA','KeyS','KeyD'].includes(e.code)) i=1;
                else if(['KeyI','KeyJ','KeyK','KeyL'].includes(e.code)) i=2;
                if(i<window.count && window.types[i]==='human' && window.alive[i]){
                  const d=keyDirs[e.code];
                  window.nextDirs[i]={x:d[0],y:d[1]};
                  window.dirs[i]={x:d[0],y:d[1]};
                }
              }
              if(e.code==='Space'&&window.mode==='turbo'&&window.alive[0]){e.preventDefault();window.boost[0]=true}
              if((e.code==='ShiftLeft'||e.code==='ShiftRight')&&window.mode==='turbo'&&window.alive[1]){e.preventDefault();window.boost[1]=true}
              if(e.code==='Enter'&&window.mode==='turbo'&&window.alive[2]){e.preventDefault();window.boost[2]=true}
            },{passive:false});
            window.addEventListener('keyup',e=>{
              if(e.code==='Space') window.boost[0]=false;
              if(e.code==='ShiftLeft'||e.code==='ShiftRight') window.boost[1]=false;
              if(e.code==='Enter') window.boost[2]=false;
            });
          })();
          </script>
          '''
          s=s.replace('</body></html>',patch+'</body></html>',1)
          p.write_text(s,encoding='utf-8')
          PY

      - name: Configurar GitHub Pages
        uses: actions/configure-pages@v5

      - name: Enviar arquivos do site
        uses: actions/upload-pages-artifact@v4
        with:
          path: '.'

      - name: Publicar no GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
