name: Deploy site para GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Baixar arquivos do repositório
        uses: actions/checkout@v6

      - name: Corrigir jogo e aplicar versão v1.9.3
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          if "let trail=[];" not in s:
              s = s.replace("let count=2,types=['human','human','cpu'],", "let trail=[];let count=2,types=['human','human','cpu'],", 1)
          s = re.sub(r'<h1>🐍 Snake Arena(?:\s*<span[^>]*>v[0-9.]+</span>)?</h1>', '<h1>🐍 Snake Arena <span style="font-size:.28em;color:#9eabc3;vertical-align:middle">v1.9.3</span></h1>', s, count=1)
          # Cada comida coletada conta como uma unidade para o drop da morte.
          s = s.replace('scores[i]+=f.value;eaten[i]+=f.value;', 'scores[i]+=f.value;eaten[i]+=1;', 1)
          # Na morte, deixar somente as comidas coletadas; não deixar tijolos/corpo sólido.
          s = s.replace('function kill(i){deadBodies.push(snakes[i].map(p=>({...p})));dropFood(i);alive[i]=false;', 'function kill(i){dropFood(i);snakes[i]=[];alive[i]=false;', 1)
          s = s.replace("if(deadBodies.some(b=>b.some(p=>p.x===h.x&&p.y===h.y)))die[i]=true;", '', 1)
          # Toda comida dropada é uma maçã visual.
          s = s.replace("f.value===5?'⭐':(f.kind==='drop'?'●':'🍎')", "f.value===5?'⭐':'🍎'", 1)
          # Desativar desenho dos antigos corpos mortos.
          old = "for(const b of deadBodies)for(const p of b){ctx.fillStyle='#b9c0cc';ctx.globalAlpha=.35;ctx.fillRect(p.x*CELL"
          if old in s:
              s = s.replace(old, "for(const b of [])for(const p of b){ctx.fillStyle='#b9c0cc';ctx.globalAlpha=.35;ctx.fillRect(p.x*CELL", 1)
          p.write_text(s, encoding='utf-8')
          PY

      - name: Configurar GitHub Pages
        uses: actions/configure-pages@v5

      - name: Enviar arquivos do site
        uses: actions/upload-pages-artifact@v4
        with:
          path: '.'

      - name: Publicar no GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
