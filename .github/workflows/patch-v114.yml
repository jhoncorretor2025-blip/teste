name: Patch Snake Arena v1.14.0

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    if: "!contains(github.event.head_commit.message, '[auto-patch-v114]')"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Apply v1.14.0 fixes
        shell: python
        run: |
          from pathlib import Path
          import re

          p = Path('index.html')
          s = p.read_text(encoding='utf-8')

          # Version
          s = re.sub(r'Snake Arena v\d+\.\d+\.\d+', 'Snake Arena v1.14.0', s, count=1)
          s = re.sub(r'(class="version">)v\d+\.\d+\.\d+', r'\g<1>v1.14.0', s, count=1)

          # Self-collision: players pass through their own body.
          s = re.sub(r"if\(mode!==['\"]turbo['\"]&&snakes\[i\]\.slice\(0,-1\)\.some\(p=>p\.x===h\.x&&p\.y===h\.y\)\)die\[i\]=true;", '', s)

          # Death: leave the collected food first, then reset score/food counters.
          old_kill = "function kill(i){dropFood(i);trail=trail.filter(t=>t.owner!==i);snakes[i]=[];alive[i]=false;deaths[i]++;respawnAt[i]=Date.now()+900;boost[i]=false;beep(240)}"
          new_kill = "function kill(i){dropFood(i);scores[i]=0;eaten[i]=0;trail=trail.filter(t=>t.owner!==i);snakes[i]=[];alive[i]=false;deaths[i]++;respawnAt[i]=Date.now()+900;boost[i]=false;beep(240)}"
          s = s.replace(old_kill, new_kill)

          # Each point makes the snake grow by one segment; the 5-point star grows by 5.
          old_food = "if(f){scores[i]+=f.value;eaten[i]++;foods.splice(foods.indexOf(f),1);beep(f.value===5?1000:700)}else{"
          new_food = "if(f){scores[i]+=f.value;eaten[i]+=f.value;for(let grow=1;grow<f.value;grow++){const last=snakes[i][snakes[i].length-1];snakes[i].push({x:last.x,y:last.y})}foods.splice(foods.indexOf(f),1);beep(f.value===5?1000:700)}else{"
          s = s.replace(old_food, new_food)

          # Share button on the initial screen.
          old_buttons = '<button id="start" class="btn" type="button">🚀 Jogar</button><button id="sound" class="btn alt" type="button">🔊 Som</button>'
          new_buttons = '<button id="start" class="btn" type="button">🚀 Jogar</button><button id="sound" class="btn alt" type="button">🔊 Som</button><button id="share" class="btn alt" type="button">📤 Compartilhar</button>'
          s = s.replace(old_buttons, new_buttons)

          share_handler = "$('share').addEventListener('click',async()=>{const url=location.href.split('?')[0];try{if(navigator.share){await navigator.share({title:'Snake Arena',text:'Vem jogar Snake Arena comigo! 🐍🎮',url})}else{await navigator.clipboard.writeText(url);alert('Link copiado! 📋')}}catch(e){}});"
          anchor = "$('refresh').addEventListener('click'"
          if "id='share'" not in s and 'id="share"' in s and share_handler not in s:
              s = s.replace(anchor, share_handler + anchor, 1)
          elif 'id="share"' in s and share_handler not in s:
              s = s.replace(anchor, share_handler + anchor, 1)

          # Update refresh cache-buster to the current version.
          s = re.sub(r"\?v=\d+\.\d+\.\d+&ts=", '?v=1.14.0&ts=', s)

          p.write_text(s, encoding='utf-8')

      - name: Commit patched file
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git diff --quiet; then
            echo "No changes needed"
            exit 0
          fi
          git add index.html
          git commit -m "Fix Snake Arena v1.14.0 [auto-patch-v114]"
          git push