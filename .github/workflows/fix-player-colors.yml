name: Fix player colors
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  patch:
    if: ${{ !contains(github.event.head_commit.message, 'Aplicar cores fixas') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply fixed player colors
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          s=s.replace(
              "const COLORS=['#67ef8a','#ff72bd','#63b3ff'],SKINS=",
              "const COLORS=['#67ef8a','#ff72bd','#63b3ff'],PLAYER_PALETTES=[['#67ef8a','#31d76c','#0fa74d'],['#ff72bd','#db4e9b','#9a2f6d'],['#63b3ff','#3686df','#245ba8']],SKINS="
          )
          s=s.replace("let pal=SKINS[skin];snakes[i]", "let pal=PLAYER_PALETTES[i];snakes[i]")
          s=s.replace(
              "ctx.shadowColor=f.value===5?'#ffd24d':'#63b3ff'",
              "ctx.shadowColor=f.value===5?'#ffd24d':f.kind==='drop'?(COLORS[f.owner]||'#fff'):'#63b3ff'"
          )
          marker="<!-- FIXED_PLAYER_COLORS -->"
          if marker not in s:
              s=s.replace('</body>', marker+'</body>')
              p.write_text(s,encoding='utf-8')
          else:
              print('Already patched')
          PY
      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Aplicar cores fixas por jogador" || exit 0
          git push